<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1069px" preserveAspectRatio="none" style="width:1430px;height:1069px;background:#FFFFFF;" version="1.1" viewBox="0 0 1430 1069" width="1430px" zoomAndPan="magnify"><title>Graph State Machine</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="165.8945" x="625.5075" y="22.9951">Graph State Machine</text><ellipse cx="947.24" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="kSuccess"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.5762" x="832.95" y="140.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="832.95" x2="1061.5262" y1="166.5938" y2="166.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.4629" x="915.0066" y="158.292">kSuccess</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.5762" x="837.95" y="182.7324">the requested Run Target is active</text></g><g id="kInTransition"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.9688" x="551.25" y="357.5669"/><line style="stroke:#181818;stroke-width:0.5;" x1="551.25" x2="783.2188" y1="383.8638" y2="383.8638"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.8701" x="621.7993" y="375.562">kInTransition</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.9688" x="556.25" y="400.0024">Run Target transition is in progress</text></g><g id="kUndefinedState"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.6992" x="731.89" y="713.8369"/><line style="stroke:#181818;stroke-width:0.5;" x1="731.89" x2="954.5892" y1="740.1338" y2="740.1338"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.9766" x="784.7513" y="731.832">kUndefinedState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.8652" x="736.89" y="756.2724">No ongoing jobs, graph is in</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.6992" x="736.89" y="770.2412">an undefined but consistent state</text></g><g id="kAborting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.6543" x="353.91" y="543.7169"/><line style="stroke:#181818;stroke-width:0.5;" x1="353.91" x2="586.5643" y1="570.0138" y2="570.0138"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.0313" x="436.2215" y="561.712">kAborting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.6543" x="358.91" y="586.1524">Wait for ongoing jobs to finish after</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.7695" x="358.91" y="600.1212">a failure or transition cancellation</text></g><!--link *start* to kSuccess--><g id="link_*start*_kSuccess"><path d="M947.24,63.6869 C947.24,80.4369 947.24,109.9669 947.24,134.0269 " fill="transparent" id="*start*-to-kSuccess" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="947.24,140.0269,951.24,131.0269,947.24,135.0269,943.24,131.0269,947.24,140.0269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.8438" x="948.24" y="106.3638">construction</text></g><!--link kSuccess to kInTransition--><g id="link_kSuccess_kInTransition"><path d="M832.52,173.7669 C763.85,180.8169 685.84,194.4469 664.24,220.5669 C632.33,259.1669 644.6319,316.8684 656.0519,351.5184 " fill="transparent" id="kSuccess-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="657.93,357.2169,658.9118,347.4171,656.3649,352.4681,651.3138,349.9212,657.93,357.2169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.4365" x="722.6482" y="233.6338">main loop iteration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.2529" x="665.24" y="248.7666">[a pending Run Target has been set,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.522" x="722.1055" y="263.8994">differs from active]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="782.3003" y="279.0322">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.2271" x="716.2529" y="294.165">start initial transition</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="782.3003" y="309.2978">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.0459" x="715.8435" y="324.4306">start transition to Off</text></g><!--link kInTransition to kSuccess--><g id="link_kInTransition_kSuccess"><path d="M783.49,367.3769 C835.8,358.6269 889.9,345.6069 908.24,327.5669 C945.17,291.2369 949.5722,232.3356 948.8522,196.9956 " fill="transparent" id="kInTransition-to-kSuccess" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="948.73,190.9969,944.9142,200.0765,948.8318,195.9958,952.9125,199.9135,948.73,190.9969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.4629" x="964.0244" y="271.1338">Last job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.9316" x="948.79" y="286.2666">[transition complete]</text></g><!--link kUndefinedState to kInTransition--><g id="link_kUndefinedState_kInTransition"><path d="M871.43,713.5169 C921.68,653.6069 1015.29,521.5669 946.24,437.8369 C925.29,412.4269 856.2753,399.4411 789.3253,392.2111 " fill="transparent" id="kUndefinedState-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="783.36,391.5669,791.8785,396.5101,788.3311,392.1037,792.7374,388.5563,783.36,391.5669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.4365" x="1028.0079" y="542.9038">main loop iteration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1924" x="970.13" y="558.0366">[a pending Run Target has been set]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1087.66" y="573.1694">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.4365" x="1028.0079" y="588.3022">main loop iteration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.688" x="1009.8822" y="603.435">[no pending Run Target]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.4419" x="1026.0052" y="618.5678">self-heal to fallback</text></g><!--link kInTransition to kUndefinedState--><g id="link_kInTransition_kUndefinedState"><path d="M551.01,393.7569 C358.41,414.7869 6,474.2969 130.24,621.8369 C205.79,711.5469 544.544,735.6679 725.534,742.2779 " fill="transparent" id="kInTransition-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="731.53,742.4969,722.682,738.1711,726.5333,742.3144,722.39,746.1657,731.53,742.4969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.8262" x="131.24" y="572.9038">same as transition to kAborting</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.647" x="154.3296" y="588.0366">but with no jobs running</text></g><!--link kInTransition to kInTransition--><g id="link_kInTransition_kInTransition"><path d="M783.72,367.5569 C804.07,369.5769 818.22,374.6269 818.22,382.6969 C818.22,390.7769 810.0407,395.2242 789.6907,397.2442 " fill="transparent" id="kInTransition-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="783.72,397.8369,793.0711,400.9283,788.6955,397.343,792.2809,392.9674,783.72,397.8369" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="866.6922" y="379.7638">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.1958" x="824.22" y="394.8966">[transition has work left]</text></g><!--link kInTransition to kAborting--><g id="link_kInTransition_kAborting"><path d="M599.66,408.3169 C583.64,416.1569 567.41,425.9569 554.24,437.8369 C521.4,467.4469 499.5049,507.4456 485.7049,537.7756 " fill="transparent" id="kInTransition-to-kAborting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="483.22,543.2369,490.5881,536.7015,485.2907,538.6858,483.3064,533.3884,483.22,543.2369" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.7998" x="611.6167" y="458.4038">activation failed, unexpected termination,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5532" x="555.24" y="473.5366">new Run Target requested, supervision failure or shutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.8696" x="689.5818" y="488.6694">[jobs still running]</text></g><!--link kAborting to kAborting--><g id="link_kAborting_kAborting"><path d="M586.99,567.7469 C607.38,568.8269 621.57,571.5169 621.57,575.8369 C621.57,580.1469 613.3716,582.5195 592.9816,583.5995 " fill="transparent" id="kAborting-to-kAborting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="586.99,583.9169,596.189,587.4352,591.983,583.6524,595.7658,579.4464,586.99,583.9169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="644.1596" y="572.9038">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.4307" x="627.57" y="588.0366">[not the last job]</text></g><!--link kAborting to kAborting--><g id="link_kAborting_kAborting"><path d="M586.97,559.4969 C662.37,556.2369 741.57,561.6869 741.57,575.8369 C741.57,589.9869 668.3644,595.686 592.9644,592.426 " fill="transparent" id="kAborting-to-kAborting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="586.97,592.1669,595.7888,596.5519,591.9653,592.3829,596.1344,588.5594,586.97,592.1669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.3774" x="747.57" y="580.4038">cancel or new request</text></g><!--link kAborting to kUndefinedState--><g id="link_kAborting_kUndefinedState"><path d="M539.96,608.2569 C606.59,638.2869 701.0301,680.8512 767.7601,710.9312 " fill="transparent" id="kAborting-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="773.23,713.3969,766.6689,706.0517,768.6717,711.3421,763.3813,713.345,773.23,713.3969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="702.12" y="664.9038">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.5415" x="710.975" y="680.0366">[last job]</text></g><!--link kSuccess to kUndefinedState--><g id="link_kSuccess_kUndefinedState"><path d="M1048.69,190.9569 C1065.36,198.3969 1081.37,208.0569 1094.24,220.5669 C1228.1,350.6669 1327.72,470.6569 1218.24,621.8369 C1158.65,704.1069 1048.2868,731.7465 960.9168,740.9765 " fill="transparent" id="kSuccess-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="954.95,741.6069,964.3204,744.6392,959.9223,741.0816,963.48,736.6835,954.95,741.6069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8696" x="1266.04" y="450.9038">unexpected termination</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1342.4087" y="466.0366">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.334" x="1293.8078" y="481.1694">late completion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.3945" x="1274.7775" y="496.3022">[last outstanding job]</text></g><!--link kUndefinedState to kUndefinedState--><g id="link_kUndefinedState_kUndefinedState"><path d="M954.91,732.1069 C975.29,733.8569 989.59,738.4769 989.59,745.9469 C989.59,753.4269 981.2678,757.5206 960.8878,759.2806 " fill="transparent" id="kUndefinedState-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="954.91,759.7969,964.2208,763.0077,959.8915,759.3667,963.5325,755.0374,954.91,759.7969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8696" x="995.59" y="750.5138">unexpected termination</text></g><rect fill="#DDDDDD" height="254.4531" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="663.8848" x="376.5124" y="795.0713"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="415.4609" x="381.5124" y="813.0664">A Run Target request will record the "pending Run Target".</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="583.0234" x="381.5124" y="829.3632">The cyclic main loop will check in each iteration for a recorded pending Run Target</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="580.5693" x="381.5124" y="845.6601">and initiates the Run Target transition when in kSuccess or kUndefinedState state.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="381.5124" y="861.957">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="550.7373" x="381.5124" y="878.2539">kUndefinedState is not terminal. Every main loop iteration leaves it, towards a</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="575.1758" x="381.5124" y="894.5507">recorded pending Run Target request if there is one and towards the fallback Run</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.3203" x="381.5124" y="910.8476">Target otherwise.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="381.5124" y="927.1445">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="566.2891" x="381.5124" y="943.4414">Before a new transition can be started any currently ongoing jobs need to finish.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="571.0059" x="381.5124" y="959.7382">kAborting is the state that is waiting for jobs to finish. No new jobs will be started</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="568.9141" x="381.5124" y="976.0351">in this state. When the in-flight job count reaches zero (no more jobs in process),</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="263.6348" x="381.5124" y="992.332">the graph moves to kUndefinedState.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="381.5124" y="1008.6289">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="653.8848" x="381.5124" y="1024.9257">Requests made while in kAborting do not change the state immediately, but only change the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="445.1357" x="381.5124" y="1041.2226">target for the transition that will be started in kUndefinedState.</text><!--SRC=[jLR9Rjim4BthAmQzT86T3-YXG0eKHO4kG9gYXzW7cXfPh2dI9QcexjTtPYZPigm6NOqSOfEplFTcOJB98hmEQb_3nwGImZkbQ-EmA7OVMwqnHdWEgKO8-BN5cB24czR1hGfRJ60YA9tCFHQxD-usA1TDCjwHoUXIElrEzus3VV3RG9wBtVN6XsJSbWm-AvEWyW6ysth-wOlVH4WUAkDCh45L2SFAAQYKiMr0eAiZprevZTOg_bBiFhaIoGxBZEavlFTdVXUm5SYI3pbrq0uMi6aJQ4z-2QnB4Db3KTmzMyDo-G96hF2b55ej8Ol7TBpasncG6YUt_FtFYNw9Ec6tKKIZzNuFXbWHq2jtfs2FhkJe8_Ph5M63w21YMgpekAemHAY2RthjrYiobiI938gWx2Ztqza83wdoeQekQFw7cKfEyxREpnZJ_OYsMjR8sLFHA6itIky6NKBhtB-GPJafz3d8L61zqM99-Ou2CiBEXnrOhD9wpjMfkjwgc1vmfNspjvXmFI2qgEx_6y9HdqhDY1RIYLWkg7VmsnurpmRIgJ5EZgdO77PZWOyZP06ntMEuDt5mqpTqhDjK-evbblQFoLWxY3TBs4MdHzKW4C_dvNf4i7BStvr9DL0XIP3U_K2a6h0k__8p6czJ4YUwEfzanjfUy_NKz0BbnC5F3KSnyuHabbcMNei1TAz11D-cQ4hyupAQpAsBnEThXRlTyeM-h7Ed2ofEAAdSxndXtDJvnJX5ON5BmmCsFYNV503NCmLAvS5LXzg7KdHvT3bm7bsHyIsTwOEsHe_cd1Zh6lMETntIEZsDBrbmgdTDgLtw9Qy4jX_4YGJX-FFBjAjfLbA88-FaUqg4RA-hWhnEJsZrITbbSkmLlBh7S9YRrp9QA1EJ5jHAdGebRNto-02A8vEcOW11mdc7WctmmSY6EIssp6WszspKcPXJVub46vSa5-xvpgU5aNSkfQ7S0NGR0crjUpX_HZZaEXZU4YpTgJDCpaIOel-Kl6ewUetm8Ujr_X2vuhS49o8_YzYd7CWnqPTg4tlcuJEBnFwDMrRMREiyrBLl7RD4rK7CViVWuGdDeuPnYkFyJ69Pdox8Atl8JvR6inOyqiu5PL3qTvE9ZoGaTN5NquIM6Zd2BRtehclbjZX2Rfe6IouvUrZ86yWxOl5qZPF8uZ0dR3UUi4pRX0i9EysHUo-tOF43]--></g></svg>