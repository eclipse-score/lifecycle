# The shared workflow owns the regular native and cross-compiled Linux rows.
# Sanitizers, QNX and documentation verification retain their dedicated jobs.
# Bazel configs select module-owned platforms and toolchains explicitly.
schema-version: 2
tests:
  linux-native:
    bazel-configs: x86_64-linux
    bazel-build-targets: //examples/... //score/...
# This module target owns the combined C++/Rust coverage pipeline.
coverage:
  bazel-target: //quality/coverage:run_coverage
  coverage-threshold: 66
  # release.yml downloads this artifact by name.
  artifact-name: coverage-html
builds:
  linux-cross:
    name: compiler
    bazel-configs: arm64-linux
    bazel-build-targets: //examples/... //score/...
    architecture: aarch64
docs:
  github-context: true
  retention-days: 3
