# The shared workflow owns the regular native and cross-compiled Linux rows.
# Sanitizers, QNX, coverage and documentation retain their dedicated jobs.
# Bazel configs select module-owned platforms and toolchains explicitly.
schema-version: 2

variants:
  - name: linux-native
    architecture:
      - name: x86_64
    os:
      - name: linux

    checks:
      tests:
        # Build the complete module graph before running all native tests.
        # Both commands must produce Bazel evidence for the shared gate to pass.
        - test-type: unit
          bazel-configs: x86_64-linux
          bazel-build-targets: //examples/... //score/...
          bazel-test-targets: //...

  - name: linux-cross
    architecture:
      - name: aarch64
    os:
      - name: linux

    checks:
      builds:
        # Cross-compilation checks the ARM toolchain without pretending that
        # native unit tests have run on ARM or requiring an emulation setup.
        - name: compiler
          bazel-configs: arm64-linux
          bazel-build-targets: //examples/... //score/...
