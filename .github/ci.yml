# The shared workflow owns Linux execution, quality checks and documentation.
# QNX retains its separate credential and pull_request_target boundary.
# Bazel configs select module-owned platforms and toolchains explicitly.
schema-version: 2
tests:
  linux-native:
    bazel-configs: x86_64-linux
    bazel-build-targets: //examples/... //score/...
  # Test-only: all-target builds currently hit these module issues.
  # https://github.com/eclipse-score/lifecycle/issues/476
  asan-ubsan-lsan:
    bazel-configs: x86_64-linux,asan_ubsan_lsan
  # https://github.com/eclipse-score/lifecycle/issues/474
  tsan:
    bazel-configs: x86_64-linux,tsan
# This module target owns the combined C++/Rust coverage pipeline.
coverage:
  bazel-target: //quality/coverage:run_coverage
  coverage-threshold: 66
  # release.yml downloads this artifact by name.
  artifact-name: coverage-html
builds:
  linux-cross:
    name: compiler
    bazel-configs: arm64-linux
    bazel-build-targets: //examples/... //score/...
    architecture: aarch64
# Cargo's toolchain version comes from rust-toolchain.toml.
clippy: {}
gitlint: true
codeql:
  bazel-configs: x86_64-linux
  # Explicit module analysis policy; shared execution and SARIF merging.
  reports: [cert-cpp-l1, cert-c-l1, cpp-code-scanning, code-complexity]
  fail-on-findings: true
docs:
  tests: linux-native-tests
  check: true
  link-check: true
