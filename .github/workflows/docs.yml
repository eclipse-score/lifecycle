name: Publish Documentation

on:
  workflow_run:
    workflows: ["PR"]
    types: [completed]

jobs:
  docs-publish:
    # Only publish for events that produce a real, addressable doc version.
    # merge_group runs are ephemeral (merge-queue checks) and would otherwise
    # cause unintended Pages publishes / preview-folder churn.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request", "push", "release"]'), github.event.workflow_run.event)
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@b8c78474a9177cabd2becbad431ff78c63ed5e8c # fix fork PR lookup after v0.0.3
    permissions:
      actions: write
      contents: write
      id-token: write
      pages: write
      pull-requests: write
    concurrency:
      group: docs-publish
      cancel-in-progress: false
      queue: max
