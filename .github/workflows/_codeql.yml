name: "CodeQL Analysis"

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      fetch-only:
        description: "When true, runs --nobuild to fetch dependencies only."
        type: string
        default: "false"
      fail-on-findings:
        description: "When true, fails if the SARIF contains findings without a suppression."
        type: string
        default: "false"

# Keep scheduled/manual analysis independent of the PR workflow. Execution and
# analysis policy are shared with the CodeQL profile in .github/ci.yml.
jobs:
  codeql-linux:
    name: CodeQL
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: eclipse-score/cicd-workflows/.github/workflows/configured-quality.yml@central-workflow
    with:
      config: .github/ci.yml
      only-codeql: true
      fetch-only: ${{ inputs.fetch-only == 'true' }}
      # Nightly analysis historically reports findings without failing.
      fail-on-findings: ${{ inputs.fail-on-findings || 'false' }}
