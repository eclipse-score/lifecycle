name: "Include check (IWYU)"

on:
  workflow_call:

jobs:
  iwyu:
    name: Run IWYU
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@cache
        with:
          disk-cache-key: ${{ github.job }}-iwyu
          enable-profiling: false

      - name: Run IWYU
        run: |
          set -euo pipefail

          # Only C++ targets, IWYU cannot analyze Rust (same query as the CodeQL job).
          bazel build --config=iwyu -- $(bazel query 'kind("cc_library|cc_binary", //score/...)')
