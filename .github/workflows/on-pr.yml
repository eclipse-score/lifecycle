name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
    # Publishing a draft release creates the tag.
    tags:
      - "v*"
  workflow_call:

jobs:
  common:
    name: Central CI
    permissions:
      contents: read
      # Only SARIF publication uses these grants; checks run read-only.
      actions: read
      security-events: write
    # Module policy and check selection live in ci.yml.
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@central-workflow
    with:
      workflow-config-yaml: .github/ci.yml

  ready:
    name: Ready to merge
    needs: common
    runs-on: ubuntu-slim
    permissions: {}
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    steps:
      - name: Fail if any required job did not succeed
        if: needs.common.result != 'success'
        run: false
