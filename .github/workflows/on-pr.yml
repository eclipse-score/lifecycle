name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
    # Publishing a draft release creates the tag.
    tags:
      - "v*"
  workflow_call:

jobs:
  common:
    name: Common checks
    permissions:
      contents: read
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@on-pr/v0.0.0

  build:
    name: Build and test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            bazel-configs: x86_64-linux
            build: true
            test: true
          - name: arm64-linux
            bazel-configs: arm64-linux
            build: true
            test: false # Cross-compiled ARM tests cannot run on these x86_64 runners.
          - name: asan_ubsan_lsan
            bazel-configs: x86_64-linux asan_ubsan_lsan
            build: false # https://github.com/eclipse-score/lifecycle/issues/476
            test: true
          - name: tsan
            bazel-configs: x86_64-linux tsan
            build: false # https://github.com/eclipse-score/lifecycle/issues/474
            test: true
    permissions:
      contents: read
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@d241348e8670bf5b8902d67ff3ac77e7f60f9ec7 # main (2026-11-11)
    with:
      # Empty target inputs skip that phase; Bazel still builds selected tests.
      build-targets: ${{ matrix.build && '//examples/... //score/...' || '' }}
      test-targets: ${{ matrix.test && '//...' || '' }}
      bazel-configs: ${{ matrix.bazel-configs }}
      cache-key: build-${{ matrix.name }}
      # The Docs job selects the native x86_64 report by its fixed name.
      artifact-name: bazel-testlogs-${{ matrix.name }}

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Cargo registry, git deps & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-clippy-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.90.0
          override: true
          components: clippy

      - name: check clippy errors
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-features --all-targets --workspace -- -D warnings

  coverage:
    name: Coverage
    uses: ./.github/workflows/code_coverage.yml
    permissions:
      contents: read

  codeql:
    name: CodeQL
    uses: ./.github/workflows/_codeql.yml
    permissions:
      contents: read
      actions: write
      security-events: write
    with:
      fail-on-findings: "true"

  docs-check:
    name: Check documentation
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-verify.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      pull-requests: write
      contents: read
    with:
      bazel-docs-verify-target: "--lockfile_mode=error //:docs_check"

  docs-link-check:
    name: Check links in documentation
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-verify.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      pull-requests: write
      contents: read
    with:
      bazel-docs-verify-target: "--lockfile_mode=error //:docs_link_check"

  docs-build:
    name: Build documentation
    needs:
      - build
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      contents: read
    with:
      # the bazel-target depends on your repo specific docs_targets configuration (e.g. "suffix")
      bazel-target: |
        --lockfile_mode=error \
        //:docs \
        -- \
        --github_user=${{ github.repository_owner }} \
        --github_repo=${{ github.event.repository.name }}
      retention-days: 3
      tests-report-artifact: bazel-testlogs-x86_64-linux

  gitlint:
    name: Check commit messages
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitlint Action
        uses: ./.github/actions/gitlint
        with:
          pr-number: ${{ github.event.number }}
          base-branch: ${{ github.event.pull_request.base.ref }}

  ready:
    name: Ready to merge
    needs:
      - common
      - build
      - docs-check
      - docs-link-check
      - docs-build
      - clippy
      - coverage
      - codeql
      - gitlint
    runs-on: ubuntu-slim
    permissions: {}
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: false
