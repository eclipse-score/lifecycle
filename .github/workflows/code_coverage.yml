#
# Reusable unified LLVM source-based coverage (C++ and Rust in one report),

name: Code coverage

on:
  workflow_call:
    inputs:
      coverage-threshold:
        description: 'Minimum effective line coverage percentage to enforce.'
        type: number
        default: 66
      artifact-name:
        description: 'Name of the uploaded coverage report artifact.'
        type: string
        default: coverage-html
      retention-days:
        description: 'Retention period for the uploaded coverage artifact.'
        type: number
        default: 10

jobs:
  coverage:
    name: Coverage
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@bazel-workflow
    permissions:
      contents: read
    with:
      test-targets: //score/...
      test-command: coverage
      bazel-configs: llvm_cov
      test-args: --build_tests_only
      coverage-justifications: quality/coverage/coverage_justifications.yaml
      coverage-threshold: ${{ inputs.coverage-threshold }}
      artifact-name: ${{ inputs.artifact-name }}
      retention-days: ${{ inputs.retention-days }}
