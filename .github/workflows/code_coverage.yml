# Collect C++ and Rust coverage and upload one combined HTML report.

name: Code coverage

on:
  workflow_call:
    inputs:
      coverage-threshold:
        description: 'Minimum line coverage percentage after applying justifications; 0 disables the coverage gate.'
        type: number
        default: 66
      artifact-name:
        description: 'Name under which the coverage report appears in the workflow run.'
        type: string
        default: coverage-html
      retention-days:
        description: 'Number of days to keep the uploaded coverage report.'
        type: number
        default: 10

jobs:
  coverage:
    name: Coverage
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@d241348e8670bf5b8902d67ff3ac77e7f60f9ec7 # main (2026-11-11)
    permissions:
      contents: read
    with:
      test-targets: //score/...
      test-command: coverage
      bazel-configs: llvm_cov
      cache-key: coverage
      test-args: --build_tests_only
      coverage-justifications: quality/coverage/coverage_justifications.yaml
      coverage-threshold: ${{ inputs.coverage-threshold }}
      artifact-name: ${{ inputs.artifact-name }}
      retention-days: ${{ inputs.retention-days }}
