<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="626px" preserveAspectRatio="none" style="width:991px;height:626px;background:#FFFFFF;" version="1.1" viewBox="0 0 991 626" width="991px" zoomAndPan="magnify"><defs/><g><g id="Fault"><rect fill="#FF0000" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="54.8838" x="779.01" y="386"/><line style="stroke:#181818;stroke-width:0.5;" x1="779.01" x2="833.8938" y1="412.2969" y2="412.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.8838" x="789.01" y="403.9951">Fault</text></g><ellipse cx="59.45" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="Deactivated"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="104.9023" x="7" y="87"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="111.9023" y1="113.2969" y2="113.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.9023" x="17" y="104.9951">Deactivated</text></g><g id="Activating"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="90.6563" x="507.12" y="87"/><line style="stroke:#181818;stroke-width:0.5;" x1="507.12" x2="597.7763" y1="113.2969" y2="113.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.6563" x="517.12" y="104.9951">Activating</text></g><g id="Ready"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="64.0918" x="520.41" y="229"/><line style="stroke:#181818;stroke-width:0.5;" x1="520.41" x2="584.5018" y1="255.2969" y2="255.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.0918" x="530.41" y="246.9951">Ready</text></g><g id="Deactivating"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="109.0518" x="262.93" y="513"/><line style="stroke:#181818;stroke-width:0.5;" x1="262.93" x2="371.9818" y1="539.2969" y2="539.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.0518" x="272.93" y="530.9951">Deactivating</text></g><!--link *start* to Deactivated--><g id="link_*start*_Deactivated"><path d="M59.45,26.36 C59.45,40.29 59.45,60.95 59.45,80.65 " fill="transparent" id="*start*-to-Deactivated" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="59.45,86.65,63.45,77.65,59.45,81.65,55.45,77.65,59.45,86.65" style="stroke:#181818;stroke-width:1;"/></g><!--link Deactivated to Activating--><g id="link_Deactivated_Activating"><path d="M112.21,112 C209.46,112 409.39,112 500.93,112 " fill="transparent" id="Deactivated-to-Activating" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="506.93,112,497.93,108,501.93,112,497.93,116,506.93,112" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.3901" x="152.9177" y="75.0669">Component is started in its configured sandbox.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.0859" x="147.5698" y="90.1997">All dependencies are ready and the component is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2056" x="139.01" y="105.3325">configured to run in the currently active Run Target.</text></g><!--link Activating to Ready--><g id="link_Activating_Ready"><path d="M552.45,137.39 C552.45,163.08 552.45,197.3 552.45,222.89 " fill="transparent" id="Activating-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="552.45,228.89,556.45,219.89,552.45,223.89,548.45,219.89,552.45,228.89" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.8545" x="591.5137" y="180.0669">The component</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.9819" x="553.45" y="195.1997">Ready Condition is fulfilled.</text></g><!--link Ready to Deactivating--><g id="link_Ready_Deactivating"><path d="M520.23,264.38 C471.24,280.47 379.12,318.34 335.45,386 C310.47,424.71 310.6182,474.8364 313.6082,506.6264 " fill="transparent" id="Ready-to-Deactivating" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="314.17,512.6,317.3097,503.265,313.7018,507.622,309.3448,504.0141,314.17,512.6" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.6328" x="336.45" y="415.5669">Component is being deactivated (e.g. due to Run Target change)</text></g><!--link Deactivating to Deactivated--><g id="link_Deactivating_Deactivated"><path d="M262.6,517.86 C198.59,492.21 95.86,439.93 51.45,356 C13.45,284.18 35.3565,188.705 49.4365,142.915 " fill="transparent" id="Deactivating-to-Deactivated" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="51.2,137.18,44.7315,144.6069,49.7305,141.9592,52.3781,146.9581,51.2,137.18" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.1602" x="100.9715" y="322.0669">Component is now deactivated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.4507" x="57.0584" y="337.1997">(this may have required</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.4033" x="217.6414" y="337.1997">forceful termination</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.999" x="52.45" y="352.3325">if component violated the shutdown timeout</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="342.449" y="352.3325">).</text></g><!--link Activating to Fault--><g id="link_Activating_Fault"><path d="M598.26,113.95 C640.8,117.32 703.03,129.03 740.45,167 C800.29,227.71 807.2686,330.93 807.1986,379.53 " fill="transparent" id="Activating-to-Fault" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="807.19,385.53,811.203,376.5358,807.1972,380.53,803.203,376.5242,807.19,385.53" style="stroke:#FF0000;stroke-width:1;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.3267" x="822.2998" y="251.0669">Component crashed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="13.2983" x="796.23" y="266.1997">or</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.9033" x="813.6607" y="266.1997">Ready Condition timeout</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="975.564" y="266.1997">.</text></g><!--link Ready to Fault--><g id="link_Ready_Fault"><path d="M561.41,279.35 C571.28,302.68 589.43,337.05 616.45,356 C667.13,391.54 693.65,366.67 752.45,386 C761.13,388.85 764.8145,390.1666 773.0945,393.8766 " fill="transparent" id="Ready-to-Fault" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="778.57,396.33,771.9924,388.9996,774.0071,394.2855,768.7212,396.3002,778.57,396.33" style="stroke:#FF0000;stroke-width:1;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.3267" x="623.293" y="329.5669">Component crashed</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.0127" x="617.45" y="344.6997">or Supervision failure.</text></g><!--link Fault to Deactivating--><g id="link_Faul