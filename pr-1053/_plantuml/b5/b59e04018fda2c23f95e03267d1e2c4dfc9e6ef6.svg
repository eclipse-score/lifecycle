<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1109px;height:1073px;background:#FFFFFF;" width="1109px" height="1073px" viewBox="0 0 1109 1073" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="446.928" y="22.995" fill="#000" font-size="14" textLength="208.305" font-weight="700">Component State Machine</text></g><!--cluster Terminating--><g class="cluster" data-qualified-name="Terminating" id="ent0004" data-source-line="7"><path d="M294.67,597.787 L687.67,597.787 A12.5,12.5 0 0 1 700.17,610.287 L700.17,619.084 L282.17,619.084 L282.17,610.287 A12.5,12.5 0 0 1 294.67,597.787" fill="#F1F1F1"/><rect x="282.17" y="597.787" width="418" height="377.78" fill="none" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="282.17" y1="619.084" x2="700.17" y2="619.084" style="stroke:#181818;stroke-width:0.5;"/><text x="448.65" y="614.782" fill="#000" font-size="14" textLength="85.039">Terminating</text></g><g class="entity" data-qualified-name="Terminating.GracefulShutdown" id="ent0005" data-source-line="8"><rect x="306.63" y="721.787" width="361.072" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="306.63" y1="748.084" x2="667.702" y2="748.084" style="stroke:#181818;stroke-width:0.5;"/><text x="422.625" y="739.782" fill="#000" font-size="14" textLength="129.083">GracefulShutdown</text><text x="311.63" y="766.079" fill="#000" font-size="14" textLength="341.072">Deactivating supervision, executing stop_action,</text><text x="311.63" y="782.376" fill="#000" font-size="14" textLength="287.26">then waiting up to the shutdown timeout</text></g><g class="entity" data-qualified-name="Terminating.ForcedShutdown" id="ent0006" data-source-line="9"><rect x="377.05" y="882.677" width="272.232" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="377.05" y1="908.974" x2="649.282" y2="908.974" style="stroke:#181818;stroke-width:0.5;"/><text x="454.432" y="900.672" fill="#000" font-size="14" textLength="117.469">ForcedShutdown</text><text x="382.05" y="926.969" fill="#000" font-size="14" textLength="201.243">Executing force_stop_action,</text><text x="382.05" y="943.266" fill="#000" font-size="14" textLength="252.232">then waiting up to kMaxSigKillDelay</text></g><g class="start_entity" data-qualified-name="Terminating..start.Terminating" id="ent0007" data-source-line="11"><ellipse cx="487.17" cy="650.787" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Terminated" id="ent0001" data-source-line="4"><rect x="567.58" y="124.297" width="177.165" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="567.58" y1="150.594" x2="744.745" y2="150.594" style="stroke:#181818;stroke-width:0.5;"/><text x="615.718" y="142.292" fill="#000" font-size="14" textLength="80.89">Terminated</text><text x="572.58" y="168.589" fill="#000" font-size="14" textLength="157.165">no resource is running</text></g><g class="entity" data-qualified-name="Starting" id="ent0002" data-source-line="5"><rect x="150.05" y="253.897" width="272.232" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="150.05" y1="280.194" x2="422.282" y2="280.194" style="stroke:#181818;stroke-width:0.5;"/><text x="258.241" y="271.892" fill="#000" font-size="14" textLength="55.85">Starting</text><text x="155.05" y="298.189" fill="#000" font-size="14" textLength="161.055">Executing start_action,</text><text x="155.05" y="314.486" fill="#000" font-size="14" textLength="252.232">then waiting for the ready condition</text></g><g class="entity" data-qualified-name="Ready" id="ent0003" data-source-line="6"><rect x="458.94" y="428.837" width="250.453" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="458.94" y1="455.134" x2="709.393" y2="455.134" style="stroke:#181818;stroke-width:0.5;"/><text x="562.121" y="446.832" fill="#000" font-size="14" textLength="44.092">Ready</text><text x="463.94" y="473.129" fill="#000" font-size="14" textLength="230.453">resource has finished its startup,</text><text x="463.94" y="489.426" fill="#000" font-size="14" textLength="219.912">supervision active if configured</text></g><g class="start_entity" data-qualified-name=".start." id="ent0010" data-source-line="15"><ellipse cx="656.17" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start*Terminating to GracefulShutdown--><g class="link" data-entity-1="ent0007" data-entity-2="ent0005" id="lnk8" data-source-line="11" data-link-type="dependency"><path d="M487.17,660.967 C487.17,674.417 487.17,695.177 487.17,716.377" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*Terminating-to-GracefulShutdown"/><polygon points="487.17,721.377,491.17,712.377,487.17,716.377,483.17,712.377,487.17,721.377" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link GracefulShutdown to ForcedShutdown--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M492.68,790.927 C497.08,817.797 502.402,850.333 506.812,877.263" style="stroke:#F00;stroke-width:1;" fill="none" id="GracefulShutdown-to-ForcedShutdown"/><polygon points="507.62,882.197,510.113,872.669,506.812,877.263,502.218,873.962,507.62,882.197" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="503.5" y="833.744" fill="#F00" font-size="13" textLength="171.501">shutdown timeout expired</text><text x="527.938" y="848.877" fill="#F00" font-size="13" textLength="122.624">/ force_stop_action</text></g><!--link *start* to Terminated--><g class="link" data-entity-1="ent0010" data-entity-2="ent0001" id="lnk11" data-source-line="15" data-link-type="dependency"><path d="M656.17,63.787 C656.17,77.727 656.17,99.227 656.17,119.107" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Terminated"/><polygon points="656.17,124.107,660.17,115.107,656.17,119.107,652.17,115.107,656.17,124.107" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Terminated to Starting--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-source-line="17" data-link-type="dependency"><path d="M567.42,151.937 C468.94,154.427 319.14,165.197 283.17,206.897 C272.3,219.487 271.272,232.842 274.252,248.792" style="stroke:#181818;stroke-width:1;" fill="none" id="Terminated-to-Starting"/><polygon points="275.17,253.707,277.449,244.125,274.252,248.792,269.585,245.595,275.17,253.707" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="284.17" y="219.964" fill="#000" font-size="13" textLength="240.24">activate() [retries left, not cancelled]</text></g><!--link Starting to Ready--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk13" data-source-line="18" data-link-type="dependency"><path d="M326.84,323.247 C346.02,338.427 369.6,355.977 392.17,369.787 C427.83,391.607 464.874,410.105 500.204,426.285" style="stroke:#181818;stroke-width:1;" fill="none" id="Starting-to-Ready"/><polygon points="504.75,428.367,498.233,420.983,500.204,426.285,494.902,428.256,504.75,428.367" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="393.17" y="365.854" fill="#000" font-size="13" textLength="131.384">ready condition met</text></g><!--link Starting to Terminating--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk14" data-source-line="19" data-link-type="dependency"><path d="M149.78,320.747 C108.79,337.247 68.33,362.197 44.17,399.787 C13.64,447.267 6,485.197 44.17,526.787 C56.23,539.927 671.35,569.367 684.17,581.787 C686.816,584.351 688.939,587.291 690.626,590.478 C691.47,592.072 692.204,593.728 692.841,595.429 C693,595.854 693.153,596.283 693.3,596.713 C693.374,596.929 693.446,597.145 693.517,597.362 C693.552,597.47 692.071,592.814 692.105,592.922" style="stroke:#F00;stroke-width:1;" fill="none" id="Starting-to-Terminating"/><polygon points="693.621,597.687,694.704,587.898,692.105,592.922,687.081,590.324,693.621,597.687" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="190.728" y="412.854" fill="#F00" font-size="13" textLength="104.533">activation failed</text><path d="M49.17,421.92 L49.17,521.92 L436.17,521.92 L436.17,431.92 L426.17,421.92 L49.17,421.92" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M426.17,421.92 L426.17,431.92 L436.17,431.92 L426.17,421.92" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="55.17" y="438.987" fill="#000" font-size="13" textLength="108.304">Activation fails if</text><ellipse cx="60.67" cy="449.685" rx="2.5" ry="2.5" fill="#000"/><text x="67.17" y="454.119" fill="#000" font-size="13" textLength="347.991">the resource terminated unexpectedly during startup</text><ellipse cx="60.67" cy="464.818" rx="2.5" ry="2.5" fill="#000"/><text x="67.17" y="469.252" fill="#000" font-size="13" textLength="194.137">the ready condition timed out</text><ellipse cx="60.67" cy="479.951" rx="2.5" ry="2.5" fill="#000"/><text x="67.17" y="484.385" fill="#000" font-size="13" textLength="354.65">the ready condition failed, e.g. resource terminated or</text><text x="63.435" y="499.518" fill="#000" font-size="13" textLength="155.924">activation got cancelled</text><ellipse cx="60.67" cy="510.217" rx="2.5" ry="2.5" fill="#000"/><text x="67.17" y="514.651" fill="#000" font-size="13" textLength="224.593">supervision could not be activated</text></g><!--link Ready to Terminating--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk15" data-source-line="29" data-link-type="dependency"><path d="M598.54,498.197 C610.56,522.607 629.95,554.517 656.17,573.787 C666.6,581.447 675.78,571.927 684.17,581.787 C686.558,584.593 688.484,587.717 690.026,591.04 C690.797,592.702 691.472,594.413 692.061,596.16 C692.208,596.596 690.871,592.259 691.008,592.7" style="stroke:#181818;stroke-width:1;" fill="none" id="Ready-to-Terminating"/><polygon points="692.486,597.476,693.646,587.696,691.008,592.7,686.004,590.062,692.486,597.476" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="657.17" y="569.854" fill="#000" font-size="13" textLength="78.971">deactivate()</text></g><!--reverse link Terminated to Ready--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk17" data-source-line="30" data-link-type="dependency"><path d="M625.35,180.946 C607.11,200.076 588.17,224.277 578.17,253.897 C558.3,312.707 567.75,386.247 576.14,428.387" style="stroke:#F00;stroke-width:1;" fill="none" id="Terminated-backto-Ready"/><polygon points="628.8,177.327,619.694,181.08,625.35,180.946,625.484,186.601,628.8,177.327" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="579.17" y="292.904" fill="#F00" font-size="13" textLength="156.87">unexpected termination</text></g><!--reverse link Terminated to Terminating--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk19" data-source-line="32" data-link-type="dependency"><path d="M689.612,180.805 C709.152,199.725 729.4,223.817 740.17,253.897 C764.12,320.827 759.93,505.497 740.17,573.787 C734.79,592.377 723.36,610.789 713.002,624.834 C710.413,628.346 707.891,631.584 705.547,634.484 C704.375,635.934 703.247,637.299 702.178,638.572 C701.644,639.208 701.124,639.821 700.621,640.41 C700.495,640.557 700.37,640.703 700.246,640.847" style="stroke:#181818;stroke-width:1;" fill="none" id="Terminated-backto-Terminating"/><polygon points="686.02,177.327,689.703,186.461,689.612,180.805,695.268,180.714,686.02,177.327" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="756.93" y="365.854" fill="#000" font-size="13" textLength="72.268">terminated</text></g><!--reverse link Terminated to ForcedShutdown--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk21" data-source-line="33" data-link-type="dependency"><path d="M749.913,175.724 C804.453,195.404 859.17,228.617 859.17,287.337 C859.17,287.337 859.17,287.337 859.17,757.227 C859.17,853.907 746.24,891.977 649.42,906.857" style="stroke:#F00;stroke-width:1;" fill="none" id="Terminated-backto-ForcedShutdown"/><polygon points="745.21,174.027,752.318,180.844,749.913,175.724,755.033,173.319,745.21,174.027" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="860.17" y="569.854" fill="#F00" font-size="13" textLength="232.991">kMaxSigKillDelay expired, giving up</text></g><g class="legend" data-source-line="35"><rect x="217.62" y="995.567" width="666.92" height="58.891" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="222.62" y="1013.562" fill="#000" font-size="14" textLength="234.404">A failed activation is retried up to</text><text x="461.475" y="1013.562" fill="#000" font-size="14" textLength="180.715" font-style="italic">activation_retry_attempts</text><text x="646.64" y="1013.562" fill="#000" font-size="14" textLength="123.423">times; afterwards</text><text x="774.513" y="1013.562" fill="#000" font-size="14" textLength="67.546" font-style="italic">activate()</text><text x="846.509" y="1013.562" fill="#000" font-size="14" textLength="33.031">fails.</text><text x="222.62" y="1029.859" fill="#000" font-size="14" textLength="564.286">A self-terminating resource exiting with 0 is expected and keeps the component</text><text x="791.357" y="1029.859" fill="#000" font-size="14" textLength="48.87" font-weight="700">Ready</text><text x="840.227" y="1029.859" fill="#000" font-size="14">.</text><text x="222.62" y="1046.156" fill="#000" font-size="14" textLength="144.095">Every failure ends in</text><text x="371.165" y="1046.156" fill="#000" font-size="14" textLength="90.959" font-weight="700">Terminated</text><text x="462.124" y="1046.156" fill="#000" font-size="14" textLength="357.581">, so the component can always be activated again.</text></g><?plantuml-src ZLJBRjim4BppAnRefHNywDaD0XHDsaEHIzsR4nYCk989qwJ0Xnye-kzTKh98sodQcyGTpkuCX_JIAuGlPjSPZTh3qdEFyCJhZTJ8c4k_Fz7kfAOl0GlG1Ymw4soD81tOeBNKxO2axTRJB-4UZrY7zEtYufhNNXezUTP-WneENAPQOopG0b5oSOBQQ24ZRA3xaLONkU66EsYabcv3iqZlUkxG4QqB7TgzTBGROgyzZTT4naQsmQAuqXAR_s80_UetosjiWbfkWXVceAdd0oQM7bcGJm0BPQRxYx3GWJT9cZjpUhb34_pOzAiXIQ9ecIrhOcdzJ_hj4pykPVjTAlM0YfyOSQ-g5vXExsyaKUb6vNJrZfnv8VJDB7UrKSOkg7n_BO0Cw2GLxkO9S_-i2_3yTlOpZlrcB4qdg67E56D5lgQn4PMB80t7WEy_mCgYjn8TA6pyXABeeUQwHgL81HltHFavEXV1WXtw0ZZgBsDn8VuS0jhQSAcoQaRT4MXPIRqbSpzV0XsbZrQh8Tr3VdrM6ZJPY3LzgXE8OCUR4hfYt-NmyG04z1bw6z7FI1cTjRCtsnfBUm4AMMtfOY8khr9jWXB9wLSSZq8mr6cHdeZUwEcDXmBpmPr1eRinFBqfXT_Pbd7gCaAiR49yrqnPARkAzFyqlxvFvwHFe9Nx_jhbIHIsqOLNuxtPnG0CvfVUnWSoHLOCDtO-pzLrB9tMt7lSTTxDv-bytIVW3SauS2jSnfEB14Z9cgLc3bKpzOKRusdZiNyZ3j9lu6ESORIKqy1RnCwbyDJZirzLwOIgAd8_xj6UKYjwDu4qKfOrGR9hLJK1PwuuA4F0rO6Vt4LKWBTSwbbCJEyO-mC0?></g></svg>