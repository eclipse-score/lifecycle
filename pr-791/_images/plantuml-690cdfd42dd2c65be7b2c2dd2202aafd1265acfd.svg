<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1020px" preserveAspectRatio="none" style="width:1262px;height:1020px;background:#FFFFFF;" version="1.1" viewBox="0 0 1262 1020" width="1262px" zoomAndPan="magnify"><title>Graph State Machine</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="165.8945" x="541.4425" y="22.9951">Graph State Machine</text><ellipse cx="828.91" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="kSuccess"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.5762" x="714.41" y="140.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="714.41" x2="942.9862" y1="166.5938" y2="166.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.4629" x="796.4666" y="158.292">kSuccess</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.5762" x="719.41" y="182.7324">the requested Run Target is active</text></g><g id="kInTransition"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.9688" x="533.91" y="357.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="533.91" x2="765.8788" y1="383.5938" y2="383.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.8701" x="604.4593" y="375.292">kInTransition</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.9688" x="538.91" y="399.7324">Run Target transition is in progress</text></g><g id="kUndefinedState"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.6992" x="729.41" y="713.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="729.41" x2="952.1092" y1="739.5938" y2="739.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.9766" x="782.2713" y="731.292">kUndefinedState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.8652" x="734.41" y="755.7324">No ongoing jobs, graph is in</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.6992" x="734.41" y="769.7012">an undefined but consistent state</text></g><g id="kAborting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.6543" x="350.41" y="543.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="350.41" x2="583.0643" y1="569.5938" y2="569.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.0313" x="432.7215" y="561.292">kAborting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.6543" x="355.41" y="585.7324">Wait for ongoing jobs to finish after</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.7695" x="355.41" y="599.7012">a failure or transition cancellation</text></g><!--link *start* to kSuccess--><g id="link_*start*_kSuccess"><path d="M828.91,63.2969 C828.91,79.9269 828.91,109.9569 828.91,134.1669 " fill="transparent" id="*start*-to-kSuccess" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="828.91,140.1669,832.91,131.1669,828.91,135.1669,824.91,131.1669,828.91,140.1669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.8438" x="829.91" y="106.3638">construction</text></g><!--link kSuccess to kInTransition--><g id="link_kSuccess_kInTransition"><path d="M714.12,188.7569 C683.46,197.1969 656.23,207.8169 646.91,220.2969 C616.98,260.3969 628.5635,317.4153 639.3335,351.5253 " fill="transparent" id="kSuccess-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="641.14,357.2469,642.2446,347.4602,639.6345,352.4789,634.6158,349.8689,641.14,357.2469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.9014" x="670.4823" y="233.3638">main loop tick</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.3291" x="655.7684" y="248.4966">[request recorded,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.522" x="654.172" y="263.6294">differs from active]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="714.3668" y="278.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.2271" x="648.3194" y="293.895">start initial transition</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="714.3668" y="309.0278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.0459" x="647.91" y="324.1606">start transition to Off</text></g><!--link kInTransition to kSuccess--><g id="link_kInTransition_kSuccess"><path d="M748.77,357.2269 C764.22,349.7669 778.74,340.0269 789.91,327.2969 C823.96,288.4869 829.3883,230.9467 829.6283,196.4367 " fill="transparent" id="kInTransition-to-kSuccess" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="829.67,190.4369,825.6075,199.4088,829.6352,195.4368,833.6073,199.4645,829.67,190.4369" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.4629" x="844.1444" y="270.8638">Last job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.9316" x="828.91" y="285.9966">[transition complete]</text></g><!--link kUndefinedState to kInTransition--><g id="link_kUndefinedState_kInTransition"><path d="M868.78,713.2769 C919.06,653.5069 1013.54,520.8769 943.91,437.2969 C921.12,409.9369 844.2344,396.9406 772.2644,390.2706 " fill="transparent" id="kUndefinedState-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="766.29,389.7169,774.8825,394.5303,771.2687,390.1783,775.6207,386.5645,766.29,389.7169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.9014" x="985.6803" y="542.3638">main loop tick</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.2686" x="970.4967" y="557.4966">[request recorded]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1029.5648" y="572.6294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.9014" x="985.6803" y="587.7622">main loop tick</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.1987" x="970.5316" y="602.895">[nothing recorded]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.4419" x="967.91" y="618.0278">self-heal to fallback</text></g><!--link kInTransition to kUndefinedState--><g id="link_kInTransition_kUndefinedState"><path d="M533.61,394.3469 C345.23,416.6669 6,477.7669 126.91,621.2969 C202.58,711.1169 541.8139,735.1305 723.0539,741.6705 " fill="transparent" id="kInTransition-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="729.05,741.8869,720.2001,737.5649,724.0533,741.7066,719.9116,745.5597,729.05,741.8869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.8262" x="127.91" y="572.3638">same as transition to kAborting</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.647" x="150.9996" y="587.4966">but with no jobs running</text></g><!--link kInTransition to kInTransition--><g id="link_kInTransition_kInTransition"><path d="M766.09,367.1469 C786.61,369.1469 800.91,374.1969 800.91,382.2969 C800.91,390.3969 792.5817,394.8648 772.0617,396.8648 " fill="transparent" id="kInTransition-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="766.09,397.4469,775.4356,400.555,771.0664,396.9618,774.6595,392.5927,766.09,397.4469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="849.3822" y="379.3638">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.1958" x="806.91" y="394.4966">[transition has work left]</text></g><!--link kInTransition to kAborting--><g id="link_kInTransition_kAborting"><path d="M594.71,407.3369 C579.76,415.4669 564.31,425.5269 551.91,437.2969 C519.74,467.8469 497.4018,507.6707 483.0918,537.6907 " fill="transparent" id="kInTransition-to-kAborting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="480.51,543.1069,487.9934,536.7039,482.6615,538.5934,480.7719,533.2615,480.51,543.1069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.7998" x="609.2867" y="457.8638">activation failed, unexpected termination,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5532" x="552.91" y="472.9966">new Run Target requested, supervision failure or shutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.8696" x="687.2518" y="488.1294">[jobs still running]</text></g><!--link kAborting to kAborting--><g id="link_kAborting_kAborting"><path d="M583.47,567.1969 C604.06,568.2569 618.41,570.9669 618.41,575.2969 C618.41,579.6269 610.0521,582.0284 589.4621,583.0884 " fill="transparent" id="kAborting-to-kAborting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="583.47,583.3969,592.6638,586.9289,588.4634,583.1398,592.2524,578.9394,583.47,583.3969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="640.9996" y="572.3638">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.4307" x="624.41" y="587.4966">[not the last job]</text></g><!--link kAborting to kAborting--><g id="link_kAborting_kAborting"><path d="M583.72,558.9669 C659.18,555.7069 738.41,561.1469 738.41,575.2969 C738.41,589.4469 665.1744,595.1458 589.7144,591.8858 " fill="transparent" id="kAborting-to-kAborting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="583.72,591.6269,592.539,596.0116,588.7153,591.8427,592.8843,588.0191,583.72,591.6269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.3774" x="744.41" y="579.8638">cancel or new request</text></g><!--link kAborting to kUndefinedState--><g id="link_kAborting_kUndefinedState"><path d="M535.94,607.3069 C603.06,637.4569 698.9769,680.5381 766.1769,710.7281 " fill="transparent" id="kAborting-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="771.65,713.1869,765.0796,705.85,767.0891,711.1379,761.8012,713.1474,771.65,713.1869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="699.91" y="664.3638">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.5415" x="708.765" y="679.4966">[last job]</text></g><!--link kSuccess to kUndefinedState--><g id="link_kSuccess_kUndefinedState"><path d="M927.32,190.4369 C944.32,197.9169 960.73,207.6569 973.91,220.2969 C1081.44,323.4269 1074.44,383.2469 1103.91,529.2969 C1112,569.3769 1125.86,586.7969 1103.91,621.2969 C1070.49,673.8169 1013.834,702.488 958.214,719.968 " fill="transparent" id="kSuccess-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="952.49,721.7669,962.2752,722.8845,957.26,720.2678,959.8767,715.2525,952.49,721.7669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8696" x="1097.91" y="450.3638">unexpected termination</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1174.2787" y="465.4966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.334" x="1125.6778" y="480.6294">late completion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.3945" x="1106.6475" y="495.7622">[last outstanding job]</text></g><!--link kUndefinedState to kUndefinedState--><g id="link_kUndefinedState_kUndefinedState"><path d="M952.69,731.4769 C973.1,733.2269 987.41,737.8369 987.41,745.2969 C987.41,752.7569 979.0781,756.8543 958.6681,758.6043 " fill="transparent" id="kUndefinedState-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="952.69,759.1169,961.9988,762.3334,957.6717,758.6897,961.3154,754.3626,952.69,759.1169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8696" x="993.41" y="749.8638">unexpected termination</text></g><rect fill="#DDDDDD" height="205.5625" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="571.2441" x="338.7677" y="794.5313"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="536.915" x="343.7677" y="812.5264">A request is only recorded, never started immediately. The transition begins</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="524.8291" x="343.7677" y="828.8232">on a later main loop iteration, and only from kSuccess or kUndefinedState.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="343.7677" y="845.1201">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="530.8926" x="343.7677" y="861.417">A transition with no work to do finalizes within the same call, so every edge</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.4199" x="343.7677" y="877.7139">into kInTransition may land in kSuccess instead.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="343.7677" y="894.0107">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="516.7764" x="343.7677" y="910.3076">kUndefinedState is not terminal. Every main loop tick leaves it, towards a</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="559.3369" x="343.7677" y="926.6045">recorded request if there is one and towards the fallback Run Target otherwise.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="343.7677" y="942.9014">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="506.0029" x="343.7677" y="959.1982">kAborting is the single drain state for failures and cancellations. It is left</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="561.0391" x="343.7677" y="975.4951">when the completion that brings the in-flight job count to zero moves the graph</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="561.2441" x="343.7677" y="991.792">to kUndefinedState. Requests made while in kAborting do not change the state.</text><!--SRC=[jLRBRjim4BphA_PMeB3z0JaKoA4e0lG192bwY7sWfPN4cY9TahBhV7s7f6JJiWEqQUkJ9N4VCpixafTUCNsmOjlIWnUUwPCeMwcvA3OFVLcoStH3lcMo_ADdvxcY-rxJex0DUvAEHEdbZelDdNwqGZlffT48oGxvqtsSbvgsrZGMcOlDxTfOBtM3W6z2UggD9QCR4svzDsj7tb0jjNGjYTgpNMf1jP2gjqmuccKkXIvPAH4kYirNNJ7Yk4gORkYpESixeoP2ZlqWgQP-ZA1rxwaqo0kmsfCB6OhYwUsAvlDtbB4I3ddRbx5ayGQFv-5q0YJovkP__ZlH7wjEsEq4Q5J6RCdBShFKJyDqCANIs8ghsL9NigxPEggjwOOfhPO06ri4REGIAkloz2ph7Fn_gUiBGb_LKwn-SKeRtmR2ibEELJrlENI7yGkbrgBSZ0pRNkj_GV1y8jbha22LGNvSeTMiO2iSxOtTaEBQhwwbEkdaem09BwSgJRTLx7ar8bGiTlyDORPnKHDnOU9EGJJO0lwvvJ9iERQjape-XfWqx_ELFfh1Z5o_PRkJRamphAPhUr-PFIR-51VPUQdKEBohX5tih1CT4tW-b-CHmLA7JTrBtv8soIs6z2EHOiGw_yjVPbHJ4YTpXPgZMwfXvgjfw0NAIO8N0xEQoUi2os4imon6qCCC79dUErdngsKqSQ2Bngzh9Uou2WS6MSTR2LLeo0luKZBXrNLN-SqwHQ6uOGsxDjwRhY2w7Pa8hcwqEfpC43pjs2PpHXhPTLn9P5U71JrYMXb1QswaTaY7_u824fivcyHbMWa2a5Gb-kkHAmnb0c5HnEQo6gDceu50qbLyoGabdp6sy13bWeZY0fJmFsoPeG3XG5mrZ7nIXrKuMw9E7D0lkaBqiHrWyIogsCEKMj0KvPf8LGjw7okSEtHq8xGb_GojxeMjyCf7if7R4-brwDboOfyZFsD003FwU6uZ9aJifKiSdIGkKuZ3VtoTL3Pq5D_3yGFXgF1G8d_lkmNTnUa7KqR2VSk9o9CMSIayhIqofnfIpsibcpOvT6bwlF91xJDRGvq9oCEf-BM0Z87qoNJfFX7WG1osRT_2IUC8ZcWmti1psGhTS0AMT17acrHS_080]--></g></svg>