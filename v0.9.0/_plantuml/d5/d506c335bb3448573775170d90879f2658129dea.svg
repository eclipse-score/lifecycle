<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1068px" preserveAspectRatio="none" style="width:1430px;height:1068px;background:#FFFFFF;" version="1.1" viewBox="0 0 1430 1068" width="1430px" zoomAndPan="magnify"><title>Graph State Machine</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="165.8945" x="625.2525" y="22.9951">Graph State Machine</text><ellipse cx="948.53" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="kSuccess"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.5762" x="834.03" y="140.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="834.03" x2="1062.6062" y1="166.5938" y2="166.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.4629" x="916.0866" y="158.292">kSuccess</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.5762" x="839.03" y="182.7324">the requested Run Target is active</text></g><g id="kInTransition"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.9688" x="552.53" y="357.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="552.53" x2="784.4988" y1="383.5938" y2="383.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.8701" x="623.0793" y="375.292">kInTransition</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.9688" x="557.53" y="399.7324">Run Target transition is in progress</text></g><g id="kUndefinedState"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.6992" x="733.03" y="713.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="733.03" x2="955.7292" y1="739.5938" y2="739.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.9766" x="785.8913" y="731.292">kUndefinedState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.8652" x="738.03" y="755.7324">No ongoing jobs, graph is in</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.6992" x="738.03" y="769.7012">an undefined but consistent state</text></g><g id="kAborting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.6543" x="354.03" y="543.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="354.03" x2="586.6843" y1="569.5938" y2="569.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.0313" x="436.3415" y="561.292">kAborting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.6543" x="359.03" y="585.7324">Wait for ongoing jobs to finish after</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.7695" x="359.03" y="599.7012">a failure or transition cancellation</text></g><!--link *start* to kSuccess--><g id="link_*start*_kSuccess"><path d="M948.53,63.2969 C948.53,79.9269 948.53,109.9569 948.53,134.1669 " fill="transparent" id="*start*-to-kSuccess" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="948.53,140.1669,952.53,131.1669,948.53,135.1669,944.53,131.1669,948.53,140.1669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.8438" x="949.53" y="106.3638">construction</text></g><!--link kSuccess to kInTransition--><g id="link_kSuccess_kInTransition"><path d="M833.81,173.5669 C765.15,180.5869 687.13,194.1869 665.53,220.2969 C633.55,258.9669 646.006,316.8603 657.436,351.4203 " fill="transparent" id="kSuccess-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="659.32,357.1169,660.2917,347.3161,657.75,352.3698,652.6963,349.8281,659.32,357.1169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.4365" x="723.9382" y="233.3638">main loop iteration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.2529" x="666.53" y="248.4966">[a pending Run Target has been set,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.522" x="723.3955" y="263.6294">differs from active]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="783.5903" y="278.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.2271" x="717.5429" y="293.895">start initial transition</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="783.5903" y="309.0278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.0459" x="717.1335" y="324.1606">start transition to Off</text></g><!--link kInTransition to kSuccess--><g id="link_kInTransition_kSuccess"><path d="M784.78,367.0369 C837.08,358.3269 891.18,345.3269 909.53,327.2969 C946.55,290.9069 950.886,231.7956 950.146,196.5556 " fill="transparent" id="kInTransition-to-kSuccess" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="950.02,190.5569,946.2098,199.6389,950.125,195.5558,954.2081,199.4709,950.02,190.5569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.4629" x="964.7644" y="270.8638">Last job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.9316" x="949.53" y="285.9966">[transition complete]</text></g><!--link kUndefinedState to kInTransition--><g id="link_kUndefinedState_kInTransition"><path d="M872.72,712.8769 C922.97,652.9769 1016.58,520.9869 947.53,437.2969 C926.57,411.8969 857.5657,398.9376 790.6157,391.7476 " fill="transparent" id="kUndefinedState-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="784.65,391.1069,793.1714,396.045,789.6214,391.6408,794.0257,388.0908,784.65,391.1069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.4365" x="1028.4079" y="542.3638">main loop iteration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1924" x="970.53" y="557.4966">[a pending Run Target has been set]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1088.06" y="572.6294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.4365" x="1028.4079" y="587.7622">main loop iteration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.688" x="1010.2822" y="602.895">[no pending Run Target]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.4419" x="1026.4052" y="618.0278">self-heal to fallback</text></g><!--link kInTransition to kUndefinedState--><g id="link_kInTransition_kUndefinedState"><path d="M552.48,393.2469 C359.61,414.1469 6,473.4769 130.53,621.2969 C206.2,711.1169 545.4339,735.1305 726.6739,741.6705 " fill="transparent" id="kInTransition-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="732.67,741.8869,723.8201,737.5649,727.6733,741.7066,723.5316,745.5597,732.67,741.8869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.8262" x="131.53" y="572.3638">same as transition to kAborting</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.647" x="154.6196" y="587.4966">but with no jobs running</text></g><!--link kInTransition to kInTransition--><g id="link_kInTransition_kInTransition"><path d="M784.71,367.1469 C805.23,369.1469 819.53,374.1969 819.53,382.2969 C819.53,390.3969 811.2017,394.8648 790.6817,396.8648 " fill="transparent" id="kInTransition-to-kInTransition" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="784.71,397.4469,794.0556,400.555,789.6864,396.9618,793.2795,392.5927,784.71,397.4469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="868.0022" y="379.3638">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.1958" x="825.53" y="394.4966">[transition has work left]</text></g><!--link kInTransition to kAborting--><g id="link_kInTransition_kAborting"><path d="M602.17,407.3069 C585.78,415.2269 569.05,425.1769 555.53,437.2969 C522.28,467.0869 499.9809,507.4875 486.0009,537.8275 " fill="transparent" id="kInTransition-to-kAborting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="483.49,543.2769,490.8893,536.7768,485.5824,538.7358,483.6235,533.4289,483.49,543.2769" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.7998" x="612.9067" y="457.8638">activation failed, unexpected termination,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5532" x="556.53" y="472.9966">new Run Target requested, supervision failure or shutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.8696" x="690.8718" y="488.1294">[jobs still running]</text></g><!--link kAborting to kAborting--><g id="link_kAborting_kAborting"><path d="M587.09,567.1969 C607.68,568.2569 622.03,570.9669 622.03,575.2969 C622.03,579.6269 613.6721,582.0284 593.0821,583.0884 " fill="transparent" id="kAborting-to-kAborting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="587.09,583.3969,596.2838,586.9289,592.0834,583.1398,595.8724,578.9394,587.09,583.3969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="644.6196" y="572.3638">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.4307" x="628.03" y="587.4966">[not the last job]</text></g><!--link kAborting to kAborting--><g id="link_kAborting_kAborting"><path d="M587.35,558.9669 C662.8,555.7069 742.03,561.1469 742.03,575.2969 C742.03,589.4469 668.7944,595.1459 593.3444,591.8859 " fill="transparent" id="kAborting-to-kAborting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="587.35,591.6269,596.1689,596.0117,592.3453,591.8427,596.5143,588.0191,587.35,591.6269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.3774" x="748.03" y="579.8638">cancel or new request</text></g><!--link kAborting to kUndefinedState--><g id="link_kAborting_kUndefinedState"><path d="M539.56,607.3069 C606.68,637.4569 702.5969,680.5381 769.7969,710.7281 " fill="transparent" id="kAborting-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="775.27,713.1869,768.6996,705.85,770.7091,711.1379,765.4212,713.1474,775.27,713.1869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.2515" x="703.53" y="664.3638">job finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.5415" x="712.385" y="679.4966">[last job]</text></g><!--link kSuccess to kUndefinedState--><g id="link_kSuccess_kUndefinedState"><path d="M1048.17,190.3269 C1065.13,197.8069 1081.46,207.5769 1094.53,220.2969 C1228.23,350.3869 1327.91,470.1769 1218.53,621.2969 C1159.22,703.2469 1049.4461,730.9098 962.3561,740.2098 " fill="transparent" id="kSuccess-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="956.39,740.8469,965.7638,743.8686,961.3617,740.316,964.9144,735.9138,956.39,740.8469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8696" x="1265.53" y="450.3638">unexpected termination</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1341.8987" y="465.4966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.334" x="1293.2978" y="480.6294">late completion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.3945" x="1274.2675" y="495.7622">[last outstanding job]</text></g><!--link kUndefinedState to kUndefinedState--><g id="link_kUndefinedState_kUndefinedState"><path d="M956.31,731.4769 C976.72,733.2269 991.03,737.8369 991.03,745.2969 C991.03,752.7569 982.6981,756.8543 962.2881,758.6043 " fill="transparent" id="kUndefinedState-to-kUndefinedState" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="956.31,759.1169,965.6188,762.3334,961.2917,758.6897,964.9354,754.3626,956.31,759.1169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8696" x="997.03" y="749.8638">unexpected termination</text></g><rect fill="#DDDDDD" height="254.4531" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="663.8848" x="376.2574" y="794.5313"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="415.4609" x="381.2574" y="812.5264">A Run Target request will record the "pending Run Target".</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="583.0234" x="381.2574" y="828.8232">The cyclic main loop will check in each iteration for a recorded pending Run Target</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="580.5693" x="381.2574" y="845.1201">and initiates the Run Target transition when in kSuccess or kUndefinedState state.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="381.2574" y="861.417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="550.7373" x="381.2574" y="877.7139">kUndefinedState is not terminal. Every main loop iteration leaves it, towards a</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="575.1758" x="381.2574" y="894.0107">recorded pending Run Target request if there is one and towards the fallback Run</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.3203" x="381.2574" y="910.3076">Target otherwise.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="381.2574" y="926.6045">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="566.2891" x="381.2574" y="942.9014">Before a new transition can be started any currently ongoing jobs need to finish.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="571.0059" x="381.2574" y="959.1982">kAborting is the state that is waiting for jobs to finish. No new jobs will be started</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="568.9141" x="381.2574" y="975.4951">in this state. When the in-flight job count reaches zero (no more jobs in process),</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="263.6348" x="381.2574" y="991.792">the graph moves to kUndefinedState.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="381.2574" y="1008.0889">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="653.8848" x="381.2574" y="1024.3857">Requests made while in kAborting do not change the state immediately, but only change the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="445.1357" x="381.2574" y="1040.6826">target for the transition that will be started in kUndefinedState.</text><!--SRC=[jLR9Rjim4BthAmQzT86T3-YXG0eKHO4kG9gYXzW7cXfPh2dI9QcexjTtPYZPigm6NOqSOfEplFTcOJB98hmEQb_3nwGImZkbQ-EmA7OVMwqnHdWEgKO8-BN5cB24czR1hGfRJ60YA9tCFHQxD-usA1TDCjwHoUXIElrEzus3VV3RG9wBtVN6XsJSbWm-AvEWyW6ysth-wOlVH4WUAkDCh45L2SFAAQYKiMr0eAiZprevZTOg_bBiFhaIoGxBZEavlFTdVXUm5SYI3pbrq0uMi6aJQ4z-2QnB4Db3KTmzMyDo-G96hF2b55ej8Ol7TBpasncG6YUt_FtFYNw9Ec6tKKIZzNuFXbWHq2jtfs2FhkJe8_Ph5M63w21YMgpekAemHAY2RthjrYiobiI938gWx2Ztqza83wdoeQekQFw7cKfEyxREpnZJ_OYsMjR8sLFHA6itIky6NKBhtB-GPJafz3d8L61zqM99-Ou2CiBEXnrOhD9wpjMfkjwgc1vmfNspjvXmFI2qgEx_6y9HdqhDY1RIYLWkg7VmsnurpmRIgJ5EZgdO77PZWOyZP06ntMEuDt5mqpTqhDjK-evbblQFoLWxY3TBs4MdHzKW4C_dvNf4i7BStvr9DL0XIP3U_K2a6h0k__8p6czJ4YUwEfzanjfUy_NKz0BbnC5F3KSnyuHabbcMNei1TAz11D-cQ4hyupAQpAsBnEThXRlTyeM-h7Ed2ofEAAdSxndXtDJvnJX5ON5BmmCsFYNV503NCmLAvS5LXzg7KdHvT3bm7bsHyIsTwOEsHe_cd1Zh6lMETntIEZsDBrbmgdTDgLtw9Qy4jX_4YGJX-FFBjAjfLbA88-FaUqg4RA-hWhnEJsZrITbbSkmLlBh7S9YRrp9QA1EJ5jHAdGebRNto-02A8vEcOW11mdc7WctmmSY6EIssp6WszspKcPXJVub46vSa5-xvpgU5aNSkfQ7S0NGR0crjUpX_HZZaEXZU4YpTgJDCpaIOel-Kl6ewUetm8Ujr_X2vuhS49o8_YzYd7CWnqPTg4tlcuJEBnFwDMrRMREiyrBLl7RD4rK7CViVWuGdDeuPnYkFyJ69Pdox8Atl8JvR6inOyqiu5PL3qTvE9ZoGaTN5NquIM6Zd2BRtehclbjZX2Rfe6IouvUrZ86yWxOl5qZPF8uZ0dR3UUi4pRX0i9EysHUo-tOF43]--></g></svg>