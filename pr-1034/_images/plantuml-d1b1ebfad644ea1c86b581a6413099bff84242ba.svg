fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="368.75" y1="917.114" x2="703.258" y2="917.114" style="stroke:#181818;stroke-width:0.5;"/><text x="470.386" y="908.812" fill="#000" font-size="14" textLength="131.236">StopRequestFailed</text><text x="373.75" y="935.109" fill="#000" font-size="14" textLength="215.934">waiting up to kMaxSigKillDelay</text><text x="373.75" y="951.406" fill="#000" font-size="14" textLength="314.508">for a termination which is already under way</text></g><g class="entity" data-qualified-name="Terminating.ForcedShutdown" id="ent0007" data-source-line="10"><rect x="737.88" y="882.667" width="272.232" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="737.88" y1="908.964" x2="1010.112" y2="908.964" style="stroke:#181818;stroke-width:0.5;"/><text x="815.262" y="900.662" fill="#000" font-size="14" textLength="117.469">ForcedShutdown</text><text x="742.88" y="926.959" fill="#000" font-size="14" textLength="201.243">Executing force_stop_action,</text><text x="742.88" y="943.256" fill="#000" font-size="14" textLength="252.232">then waiting up to kMaxSigKillDelay</text><text x="742.88" y="959.553" fill="#000" font-size="14" textLength="223.098">(also if force_stop_action failed)</text></g><g class="start_entity" data-qualified-name="Terminating..start.Terminating" id="ent0008" data-source-line="12"><ellipse cx="761" cy="650.777" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Terminating.GMN26" id="ent0027" data-source-line="17"><path d="M30.56,897.567 L30.56,952.965 A0,0 0 0 0 30.56,952.965 L333.434,952.965 A0,0 0 0 0 333.434,952.965 L333.434,929.267 L368.52,925.267 L333.434,921.267 L333.434,907.567 L323.434,897.567 L30.56,897.567 A0,0 0 0 0 30.56,897.567" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M323.434,897.567 L323.434,907.567 L333.434,907.567 L323.434,897.567" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="36.56" y="914.634" fill="#000" font-size="13" textLength="281.874">A stop request also fails if the resource has</text><text x="36.56" y="929.767" fill="#000" font-size="13" textLength="269.172">already terminated, but its termination is</text><text x="36.56" y="944.899" fill="#000" font-size="13" textLength="107.034">not handled yet.</text></g><g class="entity" data-qualified-name="Terminated" id="ent0001" data-source-line="4"><rect x="982.42" y="124.297" width="177.165" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="982.42" y1="150.594" x2="1159.585" y2="150.594" style="stroke:#181818;stroke-width:0.5;"/><text x="1030.558" y="142.292" fill="#000" font-size="14" textLength="80.89">Terminated</text><text x="987.42" y="168.589" fill="#000" font-size="14" textLength="157.165">no resource is running</text></g><g class="entity" data-qualified-name="Starting" id="ent0002" data-source-line="5"><rect x="669.88" y="253.887" width="272.232" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="669.88" y1="280.184" x2="942.112" y2="280.184" style="stroke:#181818;stroke-width:0.5;"/><text x="778.071" y="271.882" fill="#000" font-size="14" textLength="55.85">Starting</text><text x="674.88" y="298.179" fill="#000" font-size="14" textLength="161.055">Executing start_action,</text><text x="674.88" y="314.476" fill="#000" font-size="14" textLength="252.232">then waiting for the ready condition</text></g><g class="entity" data-qualified-name="Ready" id="ent0003" data-source-line="6"><rect x="800.62" y="428.837" width="466.756" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="800.62" y1="455.134" x2="1267.376" y2="455.134" style="stroke:#181818;stroke-width:0.5;"/><text x="1011.952" y="446.832" fill="#000" font-size="14" textLength="44.092">Ready</text><text x="805.62" y="473.129" fill="#000" font-size="14" textLength="230.453">resource has finished its startup,</text><text x="805.62" y="489.426" fill="#000" font-size="14" textLength="446.756">supervision active if configured and the resource is still running</text></g><g class="start_entity" data-qualified-name=".start." id="ent0012" data-source-line="23"><ellipse cx="1071" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start*Terminating to GracefulShutdown--><g class="link" data-entity-1="ent0008" data-entity-2="ent0005" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M761,660.957 C761,674.407 761,695.177 761,716.367" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*Terminating-to-GracefulShutdown"/><polygon points="761,721.367,765,712.367,761,716.367,757,712.367,761,721.367" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link GracefulShutdown to StopRequestFailed--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk10" data-source-line="13" data-link-type="dependency"><path d="M715.47,791.027 C676.43,820.007 624.495,858.567 585.475,887.527" style="stroke:#F00;stroke-width:1;" fill="none" id="GracefulShutdown-to-StopRequestFailed"/><polygon points="581.46,890.507,591.071,888.355,585.475,887.527,586.303,881.931,581.46,890.507" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="676.27" y="841.234" fill="#F00" font-size="13" textLength="114.74">stop_action failed</text></g><!--link GracefulShutdown to ForcedShutdown--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk11" data-source-line="14" data-link-type="dependency"><path d="M783.87,791.027 C801.67,817.337 823.669,849.855 842.749,878.065" style="stroke:#F00;stroke-width:1;" fill="none" id="GracefulShutdown-to-ForcedShutdown"/><polygon points="845.55,882.207,843.821,872.511,842.749,878.065,837.194,876.993,845.55,882.207" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="825.27" y="833.734" fill="#F00" font-size="13" textLength="171.501">shutdown timeout expired</text><text x="849.708" y="848.867" fill="#F00" font-size="13" textLength="122.624">/ force_stop_action</text></g><!--link *start* to Terminated--><g class="link" data-entity-1="ent0012" data-entity-2="ent0001" id="lnk13" data-source-line="23" data-link-type="dependency"><path d="M1071,63.777 C1071,77.717 1071,99.217 1071,119.097" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Terminated"/><polygon points="1071,124.097,1075,115.097,1071,119.097,1067,115.097,1071,124.097" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Terminated to Starting--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk14" data-source-line="25" data-link-type="dependency"><path d="M982.09,158.047 C913.06,165.127 825.43,179.357 803,206.887 C792.58,219.677 791.528,232.845 794.358,248.635" style="stroke:#181818;stroke-width:1;" fill="none" id="Terminated-to-Starting"/><polygon points="795.24,253.557,797.59,243.992,794.358,248.635,789.715,245.404,795.24,253.557" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="804" y="219.954" fill="#000" font-size="13" textLength="240.24">activate() [retries left, not cancelled]</text></g><!--link Starting to Ready--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk15" data-source-line="26" data-link-type="dependency"><path d="M850.61,323.197 C869.54,337.567 891.85,354.487 912,369.777 C937.62,389.217 962.295,407.926 985.395,425.436" style="stroke:#181818;stroke-width:1;" fill="none" id="Starting-to-Ready"/><polygon points="989.38,428.457,984.624,419.832,985.395,425.436,979.791,426.208,989.38,428.457" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="913" y="365.844" fill="#000" font-size="13" textLength="131.384">ready condition met</text></g><!--link Starting to Terminating--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk16" data-source-line="27" data-link-type="dependency"><path d="M669.53,307.077 C560.64,324.377 420.76,354.697 386,399.777 C351.53,444.477 347.83,485.197 386,526.777 C482.52,631.947 923.49,482.437 1026,581.777 C1028.646,584.342 1030.769,587.283 1032.456,590.471 C1033.3,592.065 1034.034,593.721 1034.671,595.423 C1034.83,595.848 1034.983,596.276 1035.13,596.707 C1035.204,596.923 1035.276,597.139 1035.347,597.356 C1035.382,597.464 1033.901,592.808 1033.935,592.916" style="stroke:#F00;stroke-width:1;" fill="none" id="Starting-to-Terminating"/><polygon points="1035.451,597.681,1036.534,587.892,1033.935,592.916,1028.911,590.318,1035.451,597.681" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="532.558" y="412.844" fill="#F00" font-size="13" textLength="104.533">activation failed</text><path d="M391,421.91 L391,521.91 L778,521.91 L778,431.91 L768,421.91 L391,421.91" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M768,421.91 L768,431.91 L778,431.91 L768,421.91" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="397" y="438.977" fill="#000" font-size="13" textLength="108.304">Activation fails if</text><ellipse cx="402.5" cy="449.675" rx="2.5" ry="2.5" fill="#000"/><text x="409" y="454.109" fill="#000" font-size="13" textLength="347.991">the resource terminated unexpectedly during startup</text><ellipse cx="402.5" cy="464.808" rx="2.5" ry="2.5" fill="#000"/><text x="409" y="469.242" fill="#000" font-size="13" textLength="194.137">the ready condition timed out</text><ellipse cx="402.5" cy="479.941" rx="2.5" ry="2.5" fill="#000"/><text x="409" y="484.375" fill="#000" font-size="13" textLength="354.65">the ready condition failed, e.g. resource terminated or</text><text x="405.265" y="499.508" fill="#000" font-size="13" textLength="155.924">activation got cancelled</text><ellipse cx="402.5" cy="510.207" rx="2.5" ry="2.5" fill="#000"/><text x="409" y="514.641" fill="#000" font-size="13" textLength="224.593">supervision could not be activated</text></g><!--link Ready to Terminating--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk17" data-source-line="37" data-link-type="dependency"><path d="M1034,497.867 C1034,524.182 1034,561.394 1034,592.402 C1034,593.371 1034,594.334 1034,595.29 C1034,595.768 1034,596.245 1034,596.72 C1034,596.957 1034,592.194 1034,592.431" style="stroke:#181818;stroke-width:1;" fill="none" id="Ready-to-Terminating"/><polygon points="1034,597.431,1038,588.431,1034,592.431,1030,588.431,1034,597.431" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1035" y="569.844" fill="#000" font-size="13" textLength="78.971">deactivate()</text></g><!--reverse link Terminated to Ready--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk19" data-source-line="38" data-link-type="dependency"><path d="M1068.503,182.159 C1065.083,222.979 1058.12,300.327 1049,369.777 C1046.44,389.297 1042.94,411.027 1039.98,428.517" style="stroke:#F00;stroke-width:1;" fill="none" id="Terminated-backto-Ready"/><polygon points="1068.92,177.177,1064.183,185.811,1068.503,182.159,1072.155,186.479,1068.92,177.177" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1062.92" y="292.904" fill="#F00" font-size="13" textLength="156.87">unexpected termination</text></g><!--reverse link Terminated to Terminating--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk21" data-source-line="40" data-link-type="dependency"><path d="M1131.93,179.635 C1165.05,197.155 1201.11,220.827 1228,253.887 C1306.19,350.007 1350.56,421.647 1285,526.777 C1252.645,578.662 1191.335,609.269 1137.41,626.976 C1110.448,635.