expired, giving up</text></g><g class="legend" data-source-line="44"><rect x="496.535" y="1011.857" width="666.92" height="58.891" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="501.535" y="1029.852" fill="#000" font-size="14" textLength="234.404">A failed activation is retried up to</text><text x="740.39" y="1029.852" fill="#000" font-size="14" textLength="180.715" font-style="italic">activation_retry_attempts</text><text x="925.555" y="1029.852" fill="#000" font-size="14" textLength="123.423">times; afterwards</text><text x="1053.428" y="1029.852" fill="#000" font-size="14" textLength="67.546" font-style="italic">activate()</text><text x="1125.424" y="1029.852" fill="#000" font-size="14" textLength="33.031">fails.</text><text x="501.535" y="1046.149" fill="#000" font-size="14" textLength="564.286">A self-terminating resource exiting with 0 is expected and keeps the component</text><text x="1070.272" y="1046.149" fill="#000" font-size="14" textLength="48.87" font-weight="700">Ready</text><text x="1119.142" y="1046.149" fill="#000" font-size="14">.</text><text x="501.535" y="1062.446" fill="#000" font-size="14" textLength="144.095">Every failure ends in</text><text x="650.08" y="1062.446" fill="#000" font-size="14" textLength="90.959" font-weight="700">Terminated</text><text x="741.039" y="1062.446" fill="#000" font-size="14" textLength="357.581">, so the component can always be activated again.</text></g><?plantuml-src hLR9Rjim4BtpAmRe9H6yz9m60O8cwQ789Uuj2Gn674b4Q5BbOiSe-kyTKhP4MUbow4qcPtrltj1UUeNmsMnQer5xM7dk4UvvsKYDZBdqynlQZTJq9U02j06BpWHR8aW7DcWjTNsm97VhwIVPtRvX6TAtYuThNdffzEn9-mOrxBXCTvMnG0SKaeizb4OB6SqEuHxIwSMGiE4EAgcbQwWMwLqNExGKreKMxLOwyeQOQqlbLJ5Y9UjWoPnhSKWrLE-yLEgaXsEtiRmV3A0x_M9vYLLGgoPuONQQghh1bAUppDBF0BFUJVkRraCBtgIAt36cbniqmVT9L-JzWDy3Ed_7fKhuZzrVx_dRIjPVgOqRL7p_f2EY7Fon2K9ZryYoYTrorS4Sj41BWVPzeZj3W8Yiju6zAbwj_zh7j90phfo974mYG9MQEMUK_x5uXldyQe8lNKqWdpz-82AVoVezO2vBeuoz88khQQxBPRgz-dFO2Gnvp1EIYEHMsY7oaywCbzEc-mge16q8SuML1rD