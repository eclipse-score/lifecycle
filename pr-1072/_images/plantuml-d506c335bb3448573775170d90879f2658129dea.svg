<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1367px;height:1080px;background:#FFFFFF;" width="1367px" height="1080px" viewBox="0 0 1367 1080" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="597.113" y="22.995" fill="#000" font-size="14" textLength="165.895" font-weight="700">Graph State Machine</text></g><g class="entity" data-qualified-name="kSuccess" id="ent0001" data-source-line="4"><rect x="870.38" y="140.297" width="263.339" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="870.38" y1="166.594" x2="1133.719" y2="166.594" style="stroke:#181818;stroke-width:0.5;"/><text x="969.818" y="158.292" fill="#000" font-size="14" textLength="64.463">kSuccess</text><text x="875.38" y="184.589" fill="#000" font-size="14" textLength="243.339">the requested Run Target is active</text></g><g class="entity" data-qualified-name="kInTransition" id="ent0002" data-source-line="5"><rect x="588.4" y="359.897" width="267.297" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="588.4" y1="386.194" x2="855.697" y2="386.194" style="stroke:#181818;stroke-width:0.5;"/><text x="676.613" y="377.892" fill="#000" font-size="14" textLength="90.87">kInTransition</text><text x="593.4" y="404.189" fill="#000" font-size="14" textLength="247.297">Run Target transition is in progress</text></g><g class="entity" data-qualified-name="kAborting" id="ent0003" data-source-line="6"><rect x="7" y="546.037" width="268.097" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="572.334" x2="275.097" y2="572.334" style="stroke:#181818;stroke-width:0.5;"/><text x="107.033" y="564.032" fill="#000" font-size="14" textLength="68.031">kAborting</text><text x="12" y="590.329" fill="#000" font-size="14" textLength="248.097">Wait for ongoing jobs to finish after</text><text x="12" y="606.626" fill="#000" font-size="14" textLength="236.564">a failure or transition cancellation</text></g><g class="entity" data-qualified-name="kUndefinedState" id="ent0004" data-source-line="7"><rect x="666.81" y="718.487" width="256.482" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="666.81" y1="744.784" x2="923.292" y2="744.784" style="stroke:#181818;stroke-width:0.5;"/><text x="736.563" y="736.482" fill="#000" font-size="14" textLength="116.977">kUndefinedState</text><text x="671.81" y="762.779" fill="#000" font-size="14" textLength="195.843">No ongoing jobs, graph is in</text><text x="671.81" y="779.076" fill="#000" font-size="14" textLength="236.482">an undefined but consistent state</text></g><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="9"><ellipse cx="1002.05" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start* to kSuccess--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-source-line="9" data-link-type="dependency"><path d="M1002.05,63.787 C1002.05,80.507 1002.05,110.727 1002.05,135.027" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-kSuccess"/><polygon points="1002.05,140.027,1006.05,131.027,1002.05,135.027,998.05,131.027,1002.05,140.027" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1003.05" y="106.364" fill="#000" font-size="13" textLength="80.844">construction</text></g><!--link kSuccess to kInTransition--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="12" data-link-type="dependency"><path d="M870.04,177.387 C806.06,185.157 738.82,198.887 719.05,222.897 C687.25,261.507 699.441,319.843 710.861,354.903" style="stroke:#181818;stroke-width:1;" fill="none" id="kSuccess-to-kInTransition"/><polygon points="712.41,359.657,713.426,349.861,710.861,354.903,705.819,352.338,712.41,359.657" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="777.458" y="235.964" fill="#000" font-size="13" textLength="123.437">main loop iteration</text><text x="720.05" y="251.097" fill="#000" font-size="13" textLength="238.253">[a pending Run Target has been set,</text><text x="776.915" y="266.229" fill="#000" font-size="13" textLength="124.522">differs from active]</text><text x="837.11" y="281.362" fill="#000" font-size="13"> </text><text x="771.063" y="296.495" fill="#000" font-size="13" textLength="136.227">start initial transition</text><text x="837.11" y="311.628" fill="#000" font-size="13"> </text><text x="770.654" y="326.761" fill="#000" font-size="13" textLength="137.046">start transition to Off</text></g><!--link kInTransition to kSuccess--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk10" data-source-line="17" data-link-type="dependency"><path d="M856,367.097 C902.36,358.247 946.8,345.977 963.05,329.897 C999.81,293.507 1004.364,233.956 1003.694,198.206" style="stroke:#181818;stroke-width:1;" fill="none" id="kInTransition-to-kSuccess"/><polygon points="1003.6,193.207,999.769,202.28,1003.694,198.206,1007.768,202.13,1003.6,193.207" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1018.904" y="273.464" fill="#000" font-size="13" textLength="106.463">Last job finished</text><text x="1003.67" y="288.597" fill="#000" font-size="13" textLength="136.932">[transition complete]</text></g><!--link kUndefinedState to kInTransition--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M822.58,718.117 C840.25,694.137 861.6,660.327 871.05,626.487 C882.05,587.107 886.8,572.217 871.05,534.487 C849.11,481.957 802.382,441.508 766.212,415.738" style="stroke:#181818;stroke-width:1;" fill="none" id="kUndefinedState-to-kInTransition"/><polygon points="762.14,412.837,767.149,421.317,766.212,415.738,771.791,414.801,762.14,412.837" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="940.038" y="547.554" fill="#000" font-size="13" textLength="123.437">main loop iteration</text><text x="882.16" y="562.687" fill="#000" font-size="13" textLength="239.192">[a pending Run Target has been set]</text><text x="999.69" y="577.819" fill="#000" font-size="13"> </text><text x="940.038" y="592.952" fill="#000" font-size="13" textLength="123.437">main loop iteration</text><text x="921.912" y="608.085" fill="#000" font-size="13" textLength="159.688">[no pending Run Target]</text><text x="938.035" y="623.218" fill="#000" font-size="13" textLength="127.442">self-heal to fallback</text></g><!--link kInTransition to kUndefinedState--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk12" data-source-line="21" data-link-type="dependency"><path d="M704.03,412.847 C674.98,457.607 624.22,552.277 657.05,626.487 C673.95,664.687 704.801,693.318 735.271,715.228" style="stroke:#181818;stroke-width:1;" fill="none" id="kInTransition-to-kUndefinedState"/><polygon points="739.33,718.147,734.358,709.645,735.271,715.228,729.688,716.14,739.33,718.147" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="658.05" y="577.554" fill="#000" font-size="13" textLength="204.826">same as transition to kAborting</text><text x="681.14" y="592.687" fill="#000" font-size="13" textLength="158.647">but with no jobs running</text></g><!--link kInTransition to kInTransition--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk9" data-source-line="16" data-link-type="dependency"><path d="M855.99,371.227 C876.65,373.487 890.7,378.477 890.7,386.187 C890.7,393.907 881.62,398.353 860.96,400.613" style="stroke:#181818;stroke-width:1;" fill="none" id="kInTransition-to-kInTransition"/><polygon points="855.99,401.157,865.372,404.154,860.96,400.613,864.502,396.202,855.99,401.157" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="939.172" y="383.254" fill="#000" font-size="13" textLength="75.251">job finished</text><text x="896.7" y="398.387" fill="#000" font-size="13" textLength="160.196">[transition has work left]</text></g><!--link kInTransition to kAborting--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk11" data-source-line="20" data-link-type="dependency"><path d="M588.09,390.877 C467.24,396.307 299.98,409.667 243.05,442.487 C202.07,466.107 174.824,509.019 158.394,541.369" style="stroke:#181818;stroke-width:1;" fill="none" id="kInTransition-to-kAborting"/><polygon points="156.13,545.827,163.772,539.614,158.394,541.369,156.639,535.991,156.13,545.827" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="300.427" y="463.054" fill="#000" font-size="13" textLength="273.8">activation failed, unexpected termination,</text><text x="244.05" y="478.187" fill="#000" font-size="13" textLength="386.553">new Run Target requested, supervision failure or shutdown</text><text x="378.392" y="493.319" fill="#000" font-size="13" textLength="117.87">[jobs still running]</text></g><!--link kAborting to kAborting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0003" id="lnk13" data-source-line="24" data-link-type="dependency"><path d="M275.31,572.597 C296.01,573.797 310.1,576.417 310.1,580.487 C310.1,584.547 301.002,586.89 280.302,588.08" style="stroke:#181818;stroke-width:1;" fill="none" id="kAborting-to-kAborting"/><polygon points="275.31,588.367,284.525,591.844,280.302,588.08,284.066,583.857,275.31,588.367" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="332.69" y="577.554" fill="#000" font-size="13" textLength="75.251">job finished</text><text x="316.1" y="592.687" fill="#000" font-size="13" textLength="108.431">[not the last job]</text></g><!--link kAborting to kAborting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0003" id="lnk15" data-source-line="26" data-link-type="dependency"><path d="M275.39,563.817 C352.69,561.317 430.1,566.877 430.1,580.487 C430.1,594.097 357.687,599.818 280.387,597.318" style="stroke:#181818;stroke-width:1;" fill="none" id="kAborting-to-kAborting-1"/><polygon points="275.39,597.157,284.256,601.446,280.387,597.318,284.515,593.45,275.39,597.157" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="436.1" y="585.054" fill="#000" font-size="13" textLength="144.377">cancel or new request</text></g><!--link kAborting to kUndefinedState--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk14" data-source-line="25" data-link-type="dependency"><path d="M271.04,615.367 C385.77,645.267 547.252,687.356 661.582,717.146" style="stroke:#181818;stroke-width:1;" fill="none" id="kAborting-to-kUndefinedState"/><polygon points="666.42,718.407,658.719,712.267,661.582,717.146,656.702,720.008,666.42,718.407" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="546.86" y="669.554" fill="#000" font-size="13" textLength="75.251">job finished</text><text x="555.715" y="684.687" fill="#000" font-size="13" textLength="57.542">[last job]</text></g><!--link kSuccess to kUndefinedState--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk16" data-source-line="29" data-link-type="dependency"><path d="M1115.47,193.327 C1128.65,200.807 1140.44,210.447 1149.05,222.897 C1195.26,289.657 1230.04,491.687 1130.05,626.487 C1081.95,691.327 1001.205,721.647 928.565,736.787" style="stroke:#181818;stroke-width:1;" fill="none" id="kSuccess-to-kUndefinedState"/><polygon points="923.67,737.807,933.297,739.886,928.565,736.787,931.665,732.055,923.67,737.807" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1194.25" y="455.554" fill="#000" font-size="13" textLength="156.87">unexpected termination</text><text x="1270.619" y="470.687" fill="#000" font-size="13"> </text><text x="1222.018" y="485.819" fill="#000" font-size="13" textLength="101.334">late completion</text><text x="1202.988" y="500.952" fill="#000" font-size="13" textLength="139.395">[last outstanding job]</text></g><!--link kUndefinedState to kUndefinedState--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk17" data-source-line="30" data-link-type="dependency"><path d="M923.7,739.037 C944.23,741.077 958.29,745.707 958.29,752.927 C958.29,760.157 949.205,764.292 928.675,766.332" style="stroke:#181818;stroke-width:1;" fill="none" id="kUndefinedState-to-kUndefinedState"/><polygon points="923.7,766.827,933.051,769.917,928.675,766.332,932.26,761.957,923.7,766.827" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="964.29" y="757.494" fill="#000" font-size="13" textLength="156.87">unexpected termination</text></g><g class="legend" data-source-line="32"><rect x="348.117" y="807.378" width="663.885" height="254.453" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="353.117" y="825.373" fill="#000" font-size="14" textLength="415.461">A Run Target request will record the "pending Run Target".</text><text x="353.117" y="841.669" fill="#000" font-size="14" textLength="583.023">The cyclic main loop will check in each iteration for a recorded pending Run Target</text><text x="353.117" y="857.966" fill="#000" font-size="14" textLength="580.569">and initiates the Run Target transition when in kSuccess or kUndefinedState state.</text><text x="353.117" y="874.263" fill="#000" font-size="14"> </text><text x="353.117" y="890.56" fill="#000" font-size="14" textLength="550.737">kUndefinedState is not terminal. Every main loop iteration leaves it, towards a</text><text x="353.117" y="906.857" fill="#000" font-size="14" textLength="575.176">recorded pending Run Target request if there is one and towards the fallback Run</text><text x="353.117" y="923.154" fill="#000" font-size="14" textLength="123.32">Target otherwise.</text><text x="353.117" y="939.451" fill="#000" font-size="14"> </text><text x="353.117" y="955.748" fill="#000" font-size="14" textLength="566.289">Before a new transition can be started any currently ongoing jobs need to finish.</text><text x="353.117" y="972.044" fill="#000" font-size="14" textLength="571.006">kAborting is the state that is waiting for jobs to finish. No new jobs will be started</text><text x="353.117" y="988.341" fill="#000" font-size="14" textLength="568.914">in this state. When the in-flight job count reaches zero (no more jobs in process),</text><text x="353.117" y="1004.638" fill="#000" font-size="14" textLength="263.635">the graph moves to kUndefinedState.</text><text x="353.117" y="1020.935" fill="#000" font-size="14"> </text><text x="353.117" y="1037.232" fill="#000" font-size="14" textLength="653.885">Requests made while in kAborting do not change the state immediately, but only change the</text><text x="353.117" y="1053.529" fill="#000" font-size="14" textLength="445.136">target for the transition that will be started in kUndefinedState.</text></g><?plantuml-src jLR9Rjim4BthAmQzT86T3-YXG0eKHO4kG9gYXzW7cXfPh2dI9QcexjTtPYZPigm6NOqSOfEplFTcOJB98hmEQb_3nwGImZkbQ-EmA7OVMwqnHdWEgKO8-BN5cB24czR1hGfRJ60YA9tCFHQxD-usA1TDCjwHoUXIElrEzus3VV3RG9wBtVN6XsJSbWm-AvEWyW6ysth-wOlVH4WUAkDCh45L2SFAAQYKiMr0eAiZprevZTOg_bBiFhaIoGxBZEavlFTdVXUm5SYI3pbrq0uMi6aJQ4z-2QnB4Db3KTmzMyDo-G96hF2b55ej8Ol7TBpasncG6YUt_FtFYNw9Ec6tKKIZzNuFXbWHq2jtfs2FhkJe8_Ph5M63w21YMgpekAemHAY2RthjrYiobiI938gWx2Ztqza83wdoeQekQFw7cKfEyxREpnZJ_OYsMjR8sLFHA6itIky6NKBhtB-GPJafz3d8L61zqM99-Ou2CiBEXnrOhD9wp