#
# Coverage justifications for the LLVM source-based coverage pipeline.
# Add entries here and mark the corresponding lines in code with
# `// COV_JUSTIFIED <id>` (or COV_JUSTIFIED_START/STOP for a region).
# Valid categories: defensive_programming, tool_false_positive,
# platform_specific, other.
version: 1
justifications:
  - id: thread-always-joinable-defensive
    category: defensive_programming
    platforms: [linux, qnx]
    reason: >
      Defensive guard for ensuring safe usage of join(). A started thread will always be joinable() until join() or detach()
      is called. In this case we are about to call join(), and we defensively check that the thread is joinable, to avoid
      an exception.
