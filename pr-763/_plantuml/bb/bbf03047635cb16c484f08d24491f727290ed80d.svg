<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="626px" preserveAspectRatio="none" style="width:991px;height:626px;background:#FFFFFF;" version="1.1" viewBox="0 0 991 626" width="991px" zoomAndPan="magnify"><defs/><g><g id="Fault"><rect fill="#FF0000" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="54.8838" x="780" y="386"/><line style="stroke:#181818;stroke-width:0.5;" x1="780" x2="834.8838" y1="412.2969" y2="412.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.8838" x="790" y="403.9951">Fault</text></g><ellipse cx="59.5" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="Deactivated"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="104.9023" x="7" y="87"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="111.9023" y1="113.2969" y2="113.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.9023" x="17" y="104.9951">Deactivated</text></g><g id="Activating"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="90.6563" x="508" y="87"/><line style="stroke:#181818;stroke-width:0.5;" x1="508" x2="598.6563" y1="113.2969" y2="113.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.6563" x="518" y="104.9951">Activating</text></g><g id="Ready"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="64.0918" x="521.5" y="229"/><line style="stroke:#181818;stroke-width:0.5;" x1="521.5" x2="585.5918" y1="255.2969" y2="255.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.0918" x="531.5" y="246.9951">Ready</text></g><g id="Deactivating"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="109.0518" x="263" y="513"/><line style="stroke:#181818;stroke-width:0.5;" x1="263" x2="372.0518" y1="539.2969" y2="539.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.0518" x="273" y="530.9951">Deactivating</text></g><!--link *start* to Deactivated--><g id="link_*start*_Deactivated"><path d="M59.5,26.01 C59.5,39.89 59.5,60.97 59.5,80.84 " fill="transparent" id="*start*-to-Deactivated" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="59.5,86.84,63.5,77.84,59.5,81.84,55.5,77.84,59.5,86.84" style="stroke:#181818;stroke-width:1;"/></g><!--link Deactivated to Activating--><g id="link_Deactivated_Activating"><path d="M112.37,112 C209.81,112 410.16,112 501.89,112 " fill="transparent" id="Deactivated-to-Activating" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="507.89,112,498.89,108,502.89,112,498.89,116,507.89,112" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.3901" x="153.4077" y="75.0669">Component is started in its configured sandbox.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.0859" x="148.0598" y="90.1997">All dependencies are ready and the component is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2056" x="139.5" y="105.3325">configured to run in the currently active Run Target.</text></g><!--link Activating to Ready--><g id="link_Activating_Ready"><path d="M553.5,137.07 C553.5,162.71 553.5,197.08 553.5,222.78 " fill="transparent" id="Activating-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="553.5,228.78,557.5,219.78,553.5,223.78,549.5,219.78,553.5,228.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.8545" x="592.5637" y="180.0669">The component</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.9819" x="554.5" y="195.1997">Ready Condition is fulfilled.</text></g><!--link Ready to Deactivating--><g id="link_Ready_Deactivating"><path d="M521.33,264.41 C472.42,280.55 380.39,318.48 336.5,386 C311.3,424.77 311.1507,475.1125 313.9107,506.8825 " fill="transparent" id="Ready-to-Deactivating" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="314.43,512.86,317.6361,503.5476,313.9973,507.8788,309.6661,504.24,314.43,512.86" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.6328" x="337.5" y="415.5669">Component is being deactivated (e.g. due to Run Target change)</text></g><!--link Deactivating to Deactivated--><g id="link_Deactivating_Deactivated"><path d="M262.85,517.8 C199.07,492.09 96.72,439.76 52.5,356 C14.57,284.15 35.911,188.7055 49.691,142.9155 " fill="transparent" id="Deactivating-to-Deactivated" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="51.42,137.17,44.9961,144.6355,49.9791,141.9579,52.6568,146.9409,51.42,137.17" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.1602" x="102.0215" y="322.0669">Component is now deactivated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.4507" x="58.1084" y="337.1997">(this may have required</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.4033" x="218.6914" y="337.1997">forceful termination</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.999" x="53.5" y="352.3325">if component violated the shutdown timeout</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="343.499" y="352.3325">).</text></g><!--link Activating to Fault--><g id="link_Activating_Fault"><path d="M599.31,113.95 C641.84,117.32 704.07,129.03 741.5,167 C801.49,227.87 808.3636,331.49 808.2536,379.9 " fill="transparent" id="Activating-to-Fault" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="808.24,385.9,812.2604,376.9091,808.2514,380.9,804.2605,376.8909,808.24,385.9" style="stroke:#FF0000;stroke-width:1;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.3267" x="822.5698" y="251.0669">Component crashed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="13.2983" x="796.5" y="266.1997">or</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.9033" x="813.9307" y="266.1997">Ready Condition timeout</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="975.834" y="266.1997">.</text></g><!--link Ready to Fault--><g id="link_Ready_Fault"><path d="M562.47,279.34 C572.34,302.66 590.49,337.03 617.5,356 C667.8,391.33 694.06,366.95 752.5,386 C761.61,388.97 765.7948,390.4685 774.4348,394.2985 " fill="transparent" id="Ready-to-Fault" style="stroke:#FF0000;stroke-width:1;"/><polygon fill="#FF0000" points="779.92,396.73,773.3132,389.4259,775.349,394.7037,770.0711,396.7395,779.92,396.73" style="stroke:#FF0000;stroke-width:1;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.3267" x="624.343" y="329.5669">Component crashed</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.0127" x="618.5" y="344.6997">or Supervision failure.</text></g><!--link Fault to Deactivating--><g id="link_Fault_Deactivating"><path d="M779.91,425.22 C771.26,429.04 761.